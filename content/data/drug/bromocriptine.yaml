name: Bromocriptine
class: Dopamine agonist (ergot derivative)
brands: [Parlodel, Cycloset]
boxed_warning: None
cautions:
  - text: "Symptomatic hypotension can occur, and syncope has been reported early in therapy. Check blood pressure."
    sources: [label-bromocriptine-2026]
  - text: "Hallucinations, psychotic disorders and sudden sleep onset can occur. Use caution with a history of psychosis."
    sources: [label-bromocriptine-2026]
  - text: "A substrate of CYP3A4, so inhibitors raise levels. May interact with dopamine antagonists and butyrophenones."
    sources: [label-bromocriptine-2026]
kidney_liver: "Safety and efficacy have not been established in kidney or liver disease. The label gives no dose adjustment."
label_source: label-bromocriptine-2026
sources: [label-bromocriptine-2026]
