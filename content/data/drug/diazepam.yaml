name: Diazepam
class: Benzodiazepine (long-acting)
brands: [Valium]
boxed_warning:
  text: "Concomitant use with opioids can cause profound sedation, respiratory depression, coma and death. Reserve the combination for patients without adequate alternatives, at the lowest doses for the shortest time, and monitor for respiratory depression and sedation. Abuse, misuse and addiction can lead to overdose or death. Continued use can cause physical dependence, and abrupt stopping or rapid dose reduction can cause life-threatening withdrawal, so taper gradually."
  sources: [label-valium-2025, label-diazepam-inj-2026]
cautions:
  - text: "Contraindicated in acute narrow-angle glaucoma (open-angle glaucoma only with treatment). The tablet label also contraindicates it in myasthenia gravis, severe respiratory insufficiency, severe hepatic insufficiency and sleep apnea syndrome."
    sources: [label-valium-2025, label-diazepam-inj-2026]
  - text: "Long half-life, and active metabolites accumulate with repeated doses, especially in older adults and liver disease. Reassess sedation before every dose."
    sources: [label-valium-2025]
  - text: "CYP3A4 and CYP2C19 inhibitors (for example cimetidine, ketoconazole, fluvoxamine, fluoxetine, omeprazole) increase and prolong sedation. Additive CNS depression with alcohol, barbiturates, antipsychotics and other CNS depressants."
    sources: [label-valium-2025]
  - text: "Paradoxical and psychiatric reactions are more likely in children and older adults. Stop it if they occur."
    sources: [label-valium-2025]
kidney_liver: "Half-life rises 2- to 5-fold in cirrhosis, and the tablet label contraindicates it in severe hepatic insufficiency. Metabolites are excreted by the kidney, so use caution in kidney impairment (injection label). Adjustments by use are on each dose."
label_source: label-valium-2025
sources: [label-valium-2025, label-diazepam-inj-2026]
