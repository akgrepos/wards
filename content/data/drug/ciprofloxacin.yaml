name: Ciprofloxacin
class: Fluoroquinolone
brands: [Cipro]
aliases: [cipro]
boxed_warning:
  text: Disabling and potentially irreversible serious reactions that can occur together, including tendinitis and tendon rupture, peripheral neuropathy and CNS effects. Stop at once and avoid all fluoroquinolones after any of these. May worsen myasthenia gravis, so avoid with a history of it. Reserve for patients with no alternative in acute exacerbation of chronic bronchitis, acute uncomplicated cystitis and acute sinusitis.
  sources: [label-cipro-oral-2026, label-cipro-iv-2025]
cautions:
  - text: Contraindicated with tizanidine and with hypersensitivity to any quinolone. Avoid theophylline (serious and fatal reactions) or monitor its level. Raises levels of other CYP1A2 drugs (for example clozapine, olanzapine, ropinirole, caffeine). Enhances warfarin, so monitor the INR.
    sources: [label-cipro-oral-2026]
  - text: QT prolongation and torsades. Avoid with known QT prolongation, hypokalemia or other QT-prolonging drugs.
    sources: [label-cipro-oral-2026]
  - text: Higher rate of aortic aneurysm and dissection in the two months after use, mostly in older adults. With a known aneurysm or high risk, use only when no alternative exists.
    sources: [label-cipro-oral-2026]
  - text: Tendon rupture risk is higher above 60 years, with corticosteroids and after kidney, heart or lung transplant. CNS effects include seizures, raised intracranial pressure, delirium and psychiatric reactions.
    sources: [label-cipro-oral-2026]
  - text: Severe hypoglycemia (including coma and death) and hyperglycemia, mostly in diabetes on insulin or oral agents. Monitor glucose. Stop at the first rash, jaundice or other sign of hypersensitivity or hepatitis.
    sources: [label-cipro-oral-2026]
  - text: Oral doses go 2 hours before or 6 hours after antacids and products with calcium, iron, zinc or magnesium.
    sources: [label-cipro-oral-2026]
kidney_liver: Reduce in kidney impairment and dialysis. The thresholds differ between oral and IV (adjustments on each dose). No change in stable cirrhosis. Acute liver failure has not been studied.
label_source: label-cipro-oral-2026
sources: [label-cipro-oral-2026, label-cipro-iv-2025]
