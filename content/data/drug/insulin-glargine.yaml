name: Insulin glargine
class: Long-acting (basal) insulin analog
brands: [Lantus]
aliases: [basal insulin, long-acting insulin]
boxed_warning: None
cautions:
  - text: Contraindicated during hypoglycemia and with hypersensitivity to insulin glargine or its excipients. Severe generalized allergy, including anaphylaxis, can occur.
    sources: [label-lantus-2025]
  - text: Hypoglycemia is the most common adverse effect and can be fatal. Risk rises with changes in meal pattern (such as NPO), activity or other glucose-lowering drugs. The long action can delay recovery. Beta-blockers and clonidine can blunt warning signs.
    sources: [label-lantus-2025]
  - text: All insulins shift potassium into cells and can cause life-threatening hypokalemia. Monitor potassium when at risk (for example on potassium-lowering drugs).
    sources: [label-lantus-2025]
  - text: Glucocorticoids, sympathomimetics (such as epinephrine and albuterol) and atypical antipsychotics raise insulin needs. Monitor glucose more often when such drugs are started or changed.
    sources: [label-lantus-2025]
  - text: SC only. Do not give IV or by insulin pump, and do not dilute or mix with any other insulin or solution. Not recommended for treating DKA (IV insulin does that).
    sources: [label-lantus-2025]
  - text: With a thiazolidinedione (such as pioglitazone), watch for fluid retention and heart failure. Never share pens or syringes between patients, even with a new needle.
    sources: [label-lantus-2025]
kidney_liver: Kidney or liver impairment raises the risk of hypoglycemia. Monitor glucose more often and lower the dose as needed. Adjustments by use are on each dose.
label_source: label-lantus-2025
sources: [label-lantus-2025]
