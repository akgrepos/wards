name: Oxycodone
class: Opioid agonist
brands: [Roxicodone]
boxed_warning:
  text: "Addiction, abuse and misuse, which can lead to overdose and death. Life-threatening respiratory depression, especially at the start and after a dose increase. Accidental ingestion, especially by children, can be fatal. Benzodiazepines and other CNS depressants, including alcohol, can cause profound sedation, respiratory depression, coma and death. Neonatal opioid withdrawal syndrome with prolonged use in pregnancy. Opioid analgesic REMS. CYP3A4 inhibitors, or stopping a CYP3A4 inducer, raise oxycodone levels and can cause fatal respiratory depression."
  sources: [label-oxycodone-2026]
cautions:
  - text: "Contraindicated with significant respiratory depression, acute or severe asthma or hypercarbia without monitoring or resuscitation equipment, and known or suspected gastrointestinal obstruction including paralytic ileus."
    sources: [label-oxycodone-2026]
  - text: "CNS depressants that add to respiratory depression include benzodiazepines, gabapentinoids, other sedatives, antipsychotics, muscle relaxants and other opioids. Avoid with MAOIs or within 14 days of stopping them. Serotonergic drugs can cause serotonin syndrome."
    sources: [label-oxycodone-2026]
  - text: "Higher risk of respiratory depression in chronic lung disease and in older, cachectic or debilitated patients. Can cause severe hypotension and adrenal insufficiency. Avoid in raised intracranial pressure, head injury or impaired consciousness."
    sources: [label-oxycodone-2026]
kidney_liver: "Clearance may fall in kidney or liver impairment. Start lower than usual and titrate carefully, watching for respiratory depression, sedation and hypotension. Adjustments by use are on each dose."
label_source: label-oxycodone-2026
sources: [label-oxycodone-2026]
