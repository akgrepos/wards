name: Lorazepam
class: Benzodiazepine (intermediate-acting)
brands: [Ativan]
boxed_warning:
  text: "Concomitant use with opioids can cause profound sedation, respiratory depression, coma and death. Reserve the combination for patients without adequate alternatives, at the lowest doses for the shortest time, and monitor for respiratory depression and sedation. Abuse, misuse and addiction can lead to overdose or death. Continued use can cause physical dependence, and abrupt stopping or rapid dose reduction can cause life-threatening withdrawal, so taper gradually."
  sources: [label-ativan-inj-2026]
cautions:
  - text: "Contraindicated in acute narrow-angle glaucoma, sleep apnea syndrome, and severe respiratory insufficiency (except during mechanical ventilation). The injection is also contraindicated with sensitivity to its vehicle (polyethylene glycol, propylene glycol, benzyl alcohol) and must never be given intra-arterially (arteriospasm and gangrene)."
    sources: [label-ativan-inj-2026]
  - text: "Use extreme caution in older adults, the very ill and those with limited pulmonary reserve, because hypoventilation and hypoxic cardiac arrest can occur. Heavy sedation can obstruct the airway. Keep ventilatory support at hand."
    sources: [label-ativan-inj-2026]
  - text: "Additive CNS depression with alcohol, antipsychotics, barbiturates and antidepressants. Apnea, coma, bradycardia, cardiac arrest and death have been reported with haloperidol, and marked sedation and rare deaths with clozapine."
    sources: [label-ativan-inj-2026]
  - text: "Valproate and probenecid roughly double lorazepam levels: halve the dose."
    sources: [label-ativan-inj-2026]
kidney_liver: "Not recommended in hepatic or renal failure, and use caution in mild to moderate hepatic or renal disease. It is glucuronidated without CYP oxidation, and cirrhosis did not change clearance of a single IV dose. Adjustments by use are on each dose."
label_source: label-ativan-inj-2026
sources: [label-ativan-inj-2026]
