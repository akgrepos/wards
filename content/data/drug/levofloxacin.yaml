name: Levofloxacin
class: Fluoroquinolone
aliases: [levo, Levaquin]
boxed_warning:
  text: Disabling and potentially irreversible serious reactions that can occur together, including tendinitis and tendon rupture, peripheral neuropathy and CNS effects. Stop at once and avoid all fluoroquinolones after any of these. May worsen myasthenia gravis, so avoid with a history of it. Reserve for patients with no alternative in uncomplicated UTI, acute bacterial exacerbation of chronic bronchitis and acute bacterial sinusitis.
  sources: [label-levofloxacin-2024, label-levofloxacin-iv-2025]
cautions:
  - text: QT prolongation and torsades. Avoid with known QT prolongation, hypokalemia or other QT-prolonging drugs. Older adults are more susceptible.
    sources: [label-levofloxacin-2024]
  - text: Higher rate of aortic aneurysm and dissection in the two months after use, mostly in older adults. With a known aneurysm or high risk, use only when no alternative exists.
    sources: [label-levofloxacin-2024]
  - text: Severe hypoglycemia (including coma and death) and hyperglycemia, mostly in diabetes on insulin or oral agents. Monitor glucose and stop if hypoglycemia occurs. Enhances warfarin, so monitor the INR.
    sources: [label-levofloxacin-2024]
  - text: Tendon rupture risk is higher above 60 years, with corticosteroids and after kidney, heart or lung transplant. CNS effects include seizures, raised intracranial pressure, delirium and psychiatric reactions.
    sources: [label-levofloxacin-2024]
  - text: Contraindicated with hypersensitivity to any quinolone. Stop at the first rash, jaundice or sign of hepatitis (severe, sometimes fatal hepatotoxicity).
    sources: [label-levofloxacin-2024]
  - text: Oral doses at least 2 hours before or after antacids with magnesium or aluminum, sucralfate, iron, zinc and multivitamins. Never in the same IV line as magnesium or other multivalent cations.
    sources: [label-levofloxacin-2024, label-levofloxacin-iv-2025]
kidney_liver: Adjust for CrCl below 50 (adjustments by regimen on each dose). Hemodialysis and CAPD do not remove it, so no extra doses. No change expected for liver impairment.
label_source: label-levofloxacin-2024
sources: [label-levofloxacin-2024, label-levofloxacin-iv-2025]
