name: Glucose
class: Fast-acting oral carbohydrate
aliases: [glucose tablets, glucose gel, oral glucose]
boxed_warning: None
cautions:
  - text: Only for an alert patient who can swallow safely. Otherwise give IV dextrose or glucagon.
    sources: [ada-soc-glycemic-2026, ada-soc-hospital-2026]
  - text: Pure glucose is preferred. Added fat slows and then prolongs the rise in glucose.
    sources: [ada-soc-glycemic-2026]
  - text: Hypoglycemia can recur while insulin or a sulfonylurea is still acting. Keep rechecking and follow with food.
    sources: [ada-soc-glycemic-2026]
kidney_liver: No dose change for kidney or liver impairment.
label_source: label-dextrose-50-2026
sources: [label-dextrose-50-2026, ada-soc-glycemic-2026, ada-soc-hospital-2026]
