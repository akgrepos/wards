drug_name: Hydrocortisone
brand: Solu-Cortef
indication: Septic shock with an ongoing vasopressor requirement
population: Adults
route: IV
amount: "200"
unit: mg
frequency: "per day: 50 mg every 6 hours or a continuous infusion"
duration: "Trial regimens: 5–7 days or until ICU discharge, with or without a taper"
max: "Not more than 400 mg per day for less than 3 days (strong recommendation against high-dose, short courses)"
cautions:
  - "Hyperglycemia and hypernatremia; possibly neuromuscular weakness."
  - "No added benefit seen above about 260 mg per day."
notes: "The 2026 guideline suggests IV corticosteroids in septic shock without naming a drug or dose; this is the SCCM 2024 regimen and the largest trial's. Septic shock is not a labeled indication."
sources: [sccm-corticosteroids-2024, ssc-sepsis-2026, adrenal-2018, label-solu-cortef-2026]
