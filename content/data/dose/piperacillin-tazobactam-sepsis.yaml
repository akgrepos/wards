drug: piperacillin-tazobactam
drug_name: Piperacillin-tazobactam
brand: Zosyn
indication: Sepsis or septic shock needing antipseudomonal or anaerobic coverage
population: Adults
route: IV
amount: "4.5"
unit: g
frequency: every 6 hours
rate: "over 3–4 hours after a first dose over 30 minutes"
alternative:
  dose: cefepime-sepsis
  when: "Alternative antipseudomonal β-lactam (e.g. with a non-severe penicillin allergy)"
adjustments:
  - when: CrCl 20–40 mL/min
    change: 3.375 g every 6 hours
  - when: CrCl <20 mL/min
    change: 2.25 g every 6 hours
  - when: Hemodialysis
    change: 2.25 g every 8 hours, plus 0.75 g after each dialysis
notes: "Extended infusion = each dose over at least half the dosing interval, or continuous. Recommended in sepsis after a loading dose (labels give short infusions). 4.5 g every 6 hours is the label's nosocomial pneumonia dose (adjustments from that column). 3.375 g every 6 hours for most other infections."
sources: [label-zosyn-2026, ssc-sepsis-2026, idsa-sepsis-hospital-2026]
verification:
  source: label-zosyn-2026
  read: not-verified
  date: 2026-10-23
