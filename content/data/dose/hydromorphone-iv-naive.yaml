drug: hydromorphone
drug_name: Hydromorphone
brand: Dilaudid
indication: Severe acute pain
indication_detail: Severe acute pain in opioid-naive patients, when oral is not possible or pain needs rapid control.
population: Opioid-naive adults
route: IV
amount: 0.2–1
unit: mg
frequency: every 2–3 hours as needed
rate: "slowly, over at least 2–3 minutes"
repeat: "Reassess in 10–15 minutes after a dose"
adjustments:
  - when: "Older adults or debilitated patients"
    change: "Start at 0.2 mg"
  - when: "Kidney or hepatic impairment"
    change: "Start at one-fourth to one-half of the usual starting dose"
cautions:
  - "Check the product concentration before drawing up. High-potency formulations are for opioid-tolerant patients only."
notes: "Prefer the low end of the range in opioid-naive patients."
sources: [label-hydromorphone-injection-2026]
verification:
  source: label-hydromorphone-injection-2026
  read: not-verified
  date: 2026-10-23
