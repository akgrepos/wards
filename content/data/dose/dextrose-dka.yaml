drug: dextrose
drug_name: Dextrose 5–10%
indication: DKA or HHS
indication_detail: DKA or HHS once glucose falls, or euglycemic DKA, so insulin can continue.
population: Adults
route: IV
amount: 5–10
unit: "%"
rate: "added to the IV fluids, at a rate that keeps glucose in the target range"
give_when: "DKA or HHS: glucose <250 mg/dL (DKA insulin lowered to half its starting rate). Euglycemic DKA: from the start of insulin"
cautions:
  - "Keep giving insulin to clear ketones. Add dextrose rather than stopping insulin."
notes: "Treatment glucose targets: DKA 150–200 mg/dL, HHS 200–250 mg/dL until resolution. UK guideline: 10% glucose at 125 mL/h once glucose is <14 mmol/L."
sources: [ada-hyperglycemic-crises-2024, jbds-dka-2023]
verification:
  source: ada-hyperglycemic-crises-2024
  read: not-verified
  date: 2026-10-23
