drug_name: Azithromycin
indication: Community-acquired pneumonia, inpatient (with a β-lactam)
population: Adults
route: IV or PO
amount: "500"
unit: mg
frequency: every 24 hours
rate: IV over 1 hour (2 mg/mL) or 3 hours (1 mg/mL); never as a bolus
cautions:
  - "QT prolongation and torsades: avoid with a long QTc, uncorrected hypokalemia or hypomagnesemia, or other QT-prolonging drugs."
  - Switch IV to oral at the same dose when improving.
notes: "IV label: at least 2 days IV, then oral. Total course follows the CAP duration on the card."
sources:
  - label-zithromax-iv-2026
  - idsa-ats-cap-2019
