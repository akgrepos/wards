drug_name: Regular insulin
indication: Moderate or severe hyperkalemia (shift potassium into cells)
population: Adults
route: IV
amount: 10
unit: units
frequency: once, with dextrose
adjustments:
  - when: "Blood glucose above 200 mg/dL"
    change: "May be given without additional dextrose"
cautions:
  - "Hypoglycemia: monitor glucose for 6 hours."
notes: "Recheck potassium at 60 minutes."
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020]
verification:
  source: ukka-hyperkalaemia-2026
  read: not-verified
