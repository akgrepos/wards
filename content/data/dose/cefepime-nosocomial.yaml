drug_name: Cefepime
indication: Hospital-acquired pneumonia, intra-abdominal, bloodstream or CNS infection needing antipseudomonal coverage
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 8 hours
rate: over 30 minutes (extended infusion over 3–4 hours is an option)
adjustments:
  - when: CrCl 30–60 mL/min
    change: 2 g every 12 hours
  - when: CrCl 11–29 mL/min
    change: 2 g every 24 hours
  - when: CrCl <11 mL/min
    change: 1 g every 24 hours
  - when: Hemodialysis
    change: 1 g every 24 hours, after dialysis on dialysis days
cautions:
  - "Neurotoxicity (encephalopathy, myoclonus, nonconvulsive status), mostly when not reduced for kidney function."
  - Does not cover anaerobes (add metronidazole for an abdominal source), MRSA or Enterococcus.
notes: "Label: 2 g every 8 hours for empiric febrile neutropenia and Pseudomonas pneumonia; the same dose is used for meningitis and for the abdominal regimens."
sources: [label-cefepime-2026, idsa-ats-hap-vap-2016, idsa-ventriculitis-2017]
