drug: cefepime
drug_name: Cefepime
indication: Pneumonia, intra-abdominal, bloodstream, CNS infection
indication_detail: Hospital-acquired pneumonia, intra-abdominal, bloodstream or CNS infection needing antipseudomonal coverage.
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 8 hours
rate: over 30 minutes (extended infusion over 3–4 hours is an option)
adjustments:
  - when: CrCl 30–60 mL/min
    change: 2 g every 12 hours
  - when: CrCl 11–29 mL/min
    change: 2 g every 24 hours
  - when: CrCl <11 mL/min
    change: 1 g every 24 hours
  - when: Hemodialysis
    change: 1 g every 24 hours, after dialysis on dialysis days
cautions:
  - Does not cover anaerobes (add metronidazole for an abdominal source), MRSA or Enterococcus.
notes: "Label: 2 g every 8 hours for empiric febrile neutropenia and for Pseudomonas pneumonia or intra-abdominal infection. The first dose is not reduced for kidney function. IDSA 2004 lists 6 g a day every 8 hours for meningitis."
sources: [label-cefepime-2026, idsa-ats-hap-vap-2016, idsa-ventriculitis-2017, idsa-meningitis-2004]
verification:
