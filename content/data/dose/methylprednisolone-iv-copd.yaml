drug: methylprednisolone
drug_name: Methylprednisolone
brand: Solu-Medrol
indication: COPD exacerbation, when oral steroids are not possible
population: Adults
route: IV
amount: "40"
unit: mg
frequency: once daily
duration: 5 days
give_when: Unable to take oral medication
cautions:
