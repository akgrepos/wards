drug: morphine
drug_name: Morphine sulfate
indication: Severe acute pain
indication_detail: Severe acute pain in opioid-naive patients, when oral is not possible or pain needs rapid control.
population: Opioid-naive adults
route: IV
amount: 2–4
unit: mg
frequency: every 3–4 hours as needed
repeat: "Reassess in 10–15 minutes after a dose. Give small repeated doses rather than one large dose"
max: "FDA label: 0.1–0.2 mg/kg every 4 hours as needed, the lowest dose necessary. Usual ward starting doses are well below that"
adjustments:
  - when: "Kidney impairment"
    change: "Lower starting dose, titrate slowly (active metabolite accumulates). Prefer hydromorphone or fentanyl"
cautions:
  - "Inject slowly. Monitor sedation and respiratory status after each dose."
notes: "The 2–4 mg ward starting range is common practice. The label is weight-based and higher."
sources: [label-morphine-injection-2026, common-practice]
verification:
  source: label-morphine-injection-2026
  read: not-verified
  date: 2026-10-23
