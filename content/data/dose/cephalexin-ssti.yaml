drug: cephalexin
drug_name: Cephalexin
indication: Mild cellulitis or erysipelas
population: Adults
route: PO
amount: "500"
unit: mg
frequency: every 6 hours
adjustments:
  - when: CrCl 30–59 mL/min
    change: "Label: no more than 1 g per day"
  - when: CrCl 15–29 mL/min
    change: 250 mg every 8–12 hours
  - when: CrCl 5–14 mL/min
    change: 250 mg every 24 hours
  - when: CrCl 1–4 mL/min
    change: 250 mg every 48–60 hours
notes: Guideline dose. The label's usual adult dose is 250 mg every 6 hours or 500 mg every 12 hours, up to 4 g per day.
