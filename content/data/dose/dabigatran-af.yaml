drug: dabigatran
drug_name: Dabigatran
brand: Pradaxa
indication: Stroke prevention in AF
indication_detail: Stroke prevention in AF. Contraindicated with a mechanical valve, and not for moderate–severe mitral stenosis.
population: Adults
route: PO
amount: "150"
unit: mg
frequency: twice daily
adjustments:
  - when: CrCl 15–30 mL/min
    change: 75 mg twice daily
  - when: CrCl 30–50 mL/min with dronedarone or systemic ketoconazole
    change: 75 mg twice daily
  - when: CrCl <30 mL/min with a P-gp inhibitor
    change: Avoid
  - when: CrCl <15 mL/min or dialysis
    change: No dosing recommendation. Avoid
sources: [label-pradaxa-2025, acc-aha-af-2023]
verification:
  source: label-pradaxa-2025
  read: not-verified
  date: 2026-10-23
