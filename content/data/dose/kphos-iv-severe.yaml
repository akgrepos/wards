drug_name: Potassium phosphates
indication: "Hypophosphatemia, serum phosphorus <1.0 mg/dL"
population: Adults
route: IV
amount: "0.44–0.64"
unit: mmol/kg
rate: "up to 6.8 mmol per hour peripheral, 15 mmol per hour central"
give_when: "Serum K⁺ <4.0 mEq/L, and oral replacement not possible or insufficient"
repeat: "Further doses only after rechecking phosphorus, calcium and K⁺"
max: "45 mmol phosphorus (66 mEq K⁺) per dose"
boxed_warning: None
alternative:
  dose: naphos-iv
  when: "Serum K⁺ ≥4.0 mEq/L"
adjustments:
  - when: "eGFR 30–59 mL/min/1.73 m²"
    change: "Start at the low end of the range"
  - when: "eGFR <30 mL/min/1.73 m² or kidney failure"
    change: "Contraindicated"
cautions:
  - "Single doses of 50 mmol or more, or infusion over only 1–3 hours, have caused cardiac arrest and death."
  - "Contraindicated in hyperkalemia, hyperphosphatemia, hypercalcemia or significant hypocalcemia."
  - "Correct calcium first. Never infuse with calcium-containing fluids."
  - "Dilute in 100–250 mL of saline or D5W. Peripheral concentration up to 6.8 mmol per 100 mL."
  - "Each mmol of phosphorus brings about 1.5 mEq of K⁺. Continuous ECG and a central line above 10 mEq K⁺ per hour."
notes: "Dose by actual body weight. Consider adjusted body weight if well above ideal weight. Rapid IV phosphate can cause hypocalcemia."
sources: [label-kphos-injection-2026, ada-hyperglycemic-crises-2024]
verification:
  source: label-kphos-injection-2026
  read: not-verified
  date: 2026-10-23
