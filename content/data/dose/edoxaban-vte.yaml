drug: edoxaban
drug_name: Edoxaban
brand: Savaysa
indication: Acute DVT or PE treatment
indication_detail: Acute DVT or PE treatment, after 5–10 days of parenteral anticoagulation.
population: Adults
route: PO
amount: "60"
unit: mg
frequency: once daily
adjustments:
  - when: CrCl 15–50 mL/min, weight ≤60 kg, or certain P-gp inhibitors (verapamil, quinidine, or short-term azithromycin, clarithromycin, erythromycin, oral ketoconazole or oral itraconazole)
    change: 30 mg once daily
  - when: CrCl <15 mL/min
    change: Not recommended
  - when: Liver impairment
    change: "Child-Pugh A: no change. B or C: not recommended"
cautions:
  - "Needs 5–10 days of parenteral anticoagulation first."
sources: [label-savaysa-2025, ash-vte-treatment-2020]
verification:
  source: label-savaysa-2025
  read: fda-label
  date: 2026-10-25
