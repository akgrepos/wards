drug_name: Enoxaparin
brand: Lovenox
indication: NSTE-ACS anticoagulation
population: Adults
route: SC
amount: "1"
unit: mg/kg
frequency: every 12 hours
duration: "At least 2 days and until stable; usually 2–8 days, or until PCI"
boxed_warning: "Spinal or epidural hematoma with neuraxial anesthesia or spinal puncture."
adjustments:
  - when: CrCl <30 mL/min
    change: 1 mg/kg once daily
cautions:
  - "Contraindicated with heparin-induced thrombocytopenia in the past 100 days or circulating antibodies."
  - "At PCI: no extra dose if the last dose was within 8 hours; 0.3 mg/kg IV if 8–12 hours."
  - "Low body weight raises exposure: watch for bleeding."
sources: [label-lovenox-2026, acc-aha-acs-2025]
