drug_name: Oseltamivir
brand: Tamiflu
indication: Influenza with pneumonia, hospitalized
population: Adults
route: PO
amount: "75"
unit: mg
frequency: every 12 hours
duration: 5 days
give_when: As soon as possible; in hospitalized patients regardless of time since symptom onset
adjustments:
  - when: CrCl >30–60 mL/min
    change: 30 mg twice daily
  - when: CrCl >10–30 mL/min
    change: 30 mg once daily
  - when: Hemodialysis
    change: 30 mg, then 30 mg after each session (no more than 5 days)
  - when: CAPD
    change: A single 30 mg dose
  - when: End-stage kidney disease not on dialysis
    change: Not recommended
notes: The label indication is treatment within 48 hours of symptoms; guidelines treat all hospitalized patients regardless of duration.
sources:
  - label-tamiflu-2025
  - idsa-ats-cap-2019
  - idsa-influenza-2018
verification:
  source: label-tamiflu-2025
  read: not-verified
  date: 2026-10-23
