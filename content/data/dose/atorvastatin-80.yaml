drug_name: Atorvastatin
brand: Lipitor
indication: High-intensity statin after ACS
population: Adults
route: PO
amount: "80"
unit: mg
frequency: once daily
adjustments:
  - when: Clarithromycin, itraconazole and some HIV or hepatitis C protease inhibitors
    change: Maximum 20 mg daily (40 mg with nelfinavir)
  - when: Liver
    change: Contraindicated in acute liver failure or decompensated cirrhosis
cautions:
  - "No kidney adjustment; kidney impairment raises myopathy risk."
  - "Recent hemorrhagic stroke: weigh risk (more hemorrhagic strokes with this dose after stroke or TIA)."
notes: "Rosuvastatin is the other high-intensity option."
sources: [acc-aha-acs-2025, label-lipitor-2024]
verification:
  source: label-lipitor-2024
  read: not-verified
  date: 2026-10-23
