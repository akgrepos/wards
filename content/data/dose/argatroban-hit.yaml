drug_name: Argatroban
indication: Heparin-induced thrombocytopenia (with or without thrombosis)
population: Adults
route: IV
amount: "2"
unit: mcg/kg/min
frequency: continuous infusion, titrated to aPTT 1.5–3 times baseline (not above 100 seconds)
max: "10 mcg/kg/min"
boxed_warning: "None"
adjustments:
  - when: Moderate or severe liver impairment, heart failure, multiorgan failure, severe anasarca, or after cardiac surgery
    change: Start at 0.5 mcg/kg/min
  - when: Kidney impairment
    change: No adjustment
cautions:
  - "Raises the INR itself: use a chromogenic factor X assay or follow the label's warfarin conversion."
  - "Stop all heparin, including flushes and heparin-coated catheters."
sources: [label-argatroban-2026, ash-hit-2018]
