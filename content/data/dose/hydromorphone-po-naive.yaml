drug_name: Hydromorphone
brand: Dilaudid
indication: Moderate to severe acute pain, opioid-naive
population: Opioid-naive adults
route: PO
amount: 2–4
unit: mg
frequency: every 4–6 hours as needed
repeat: "Reassess pain, sedation and respiratory rate before each repeat dose"
boxed_warning: "Addiction, abuse and misuse. Life-threatening respiratory depression. Accidental ingestion. Risks with benzodiazepines and other CNS depressants."
adjustments:
  - when: "Kidney or hepatic impairment"
    change: "Start at one-fourth to one-half of the usual starting dose"
cautions:
  - "About 5 times as potent as oral morphine (CDC conversion factor 5.0). Never order it as if it were morphine."
  - "2 mg is about 10 MME, the top of the CDC 2022 usual single starting dose for opioid-naive patients. Start at 2 mg or less (half a tablet) in older or frail patients."
sources: [label-hydromorphone-oral-2026, cdc-opioid-2022]
verification:
  source: label-hydromorphone-oral-2026
  read: not-verified
  date: 2026-10-23
