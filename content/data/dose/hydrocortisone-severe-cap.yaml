drug_name: Hydrocortisone
indication: Severe community-acquired pneumonia in the ICU, without septic shock or influenza
population: Adults
route: IV
amount: "200"
unit: mg
frequency: per day as a continuous infusion
give_when: Within 24 hours of meeting severe CAP criteria
duration: "4 days (7 if not improved by day 4), then tapered: 8 or 14 days in total"
cautions:
  - "Septic shock was excluded from the trial: use sepsis dosing instead."
  - "Influenza: not recommended."
  - "Hyperglycemia: monitor glucose."
notes: CAPE COD regimen. Taper as in the trial. ICU protocols vary.
sources:
  - cape-cod-2023
  - ats-cap-2025
  - sccm-corticosteroids-2024
verification:
