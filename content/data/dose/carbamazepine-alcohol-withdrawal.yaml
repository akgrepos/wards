drug: carbamazepine
drug_name: Carbamazepine
brand: Tegretol
indication: Mild to moderate alcohol withdrawal
indication_detail: Off-label for mild to moderate alcohol withdrawal when benzodiazepines are contraindicated, or as an adjunct.
population: Adults without prior bone marrow depression. Screen for HLA-B*1502 in patients of at-risk Asian ancestry
route: PO
amount: 200
unit: mg
frequency: "every 8 hours as an adjunct (400 mg every 12 hours is an alternative). Monotherapy 600–800 mg a day, tapered to 200–400 mg a day over 4–9 days"
give_when: Mild or moderate withdrawal, including when benzodiazepines are contraindicated, or as an adjunct after an adequate benzodiazepine dose
cautions:
  - "Not for patients with complicated withdrawal, seizures from withdrawal or delirium."
notes: "Not labeled for alcohol withdrawal. ASAM Appendix V sample regimens."
sources: [asam-alcohol-withdrawal-2020, label-tegretol-2026]
verification:
  source: asam-alcohol-withdrawal-2020
  read: not-verified
  date: 2026-10-23
