drug: sodium-potassium-phosphates
drug_name: Sodium and potassium phosphates
brand: "K-Phos Neutral, Phospha 250 Neutral"
indication: Hypophosphatemia, oral
indication_detail: Hypophosphatemia in a patient able to take oral.
population: Adults
route: PO
amount: "250–500"
unit: mg
frequency: "of phosphorus (1–2 tablets) four times daily, with meals and at bedtime"
adjustments:
  - when: "Severe kidney impairment (under 30% of normal function)"
    change: "Contraindicated"
cautions:
  - "Each tablet contains 13 mEq of sodium and 1.1 mEq of K⁺."
notes: "Take with a full glass of water. Each tablet supplies 250 mg of phosphorus (about 8 mmol)."
sources: [label-kphos-neutral-2023]
verification:
  source: label-kphos-neutral-2023
  read: not-verified
  date: 2026-10-23
