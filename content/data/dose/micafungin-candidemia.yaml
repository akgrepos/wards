drug_name: Micafungin
brand: Mycamine
indication: Candidemia and invasive candidiasis
population: Adults
route: IV
amount: "100"
unit: mg
frequency: every 24 hours
rate: over 1 hour
duration: 14 days after the first negative blood culture, if no metastatic focus
cautions:
  - Echinocandins are the first choice for non-neutropenic candidemia.
  - Does not reach the urine, eyes or CNS well.
  - Liver enzyme elevations; check hepatic panel.
notes: "Guideline dose for candidemia is 100 mg daily; the label lists 100 mg daily for candidemia as well."
sources: [idsa-candida-2016, label-micafungin-2025]
