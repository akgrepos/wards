drug: ceftriaxone
drug_name: Ceftriaxone
indication: Antibiotic prophylaxis in cirrhosis with acute variceal bleeding
population: Adults
route: IV
amount: "1"
unit: g
frequency: every 24 hours
rate: over 30 minutes
duration: Up to 5 days, or until discharge if sooner
boxed_warning: None
cautions:
  - Start at presentation with the bleed. Stop when the bleeding has resolved and vasoactive drugs are stopped.
notes: "The 2021 guidance set a maximum of 7 days."
sources: [aasld-portal-htn-2024, aasld-ascites-hrs-2021, label-ceftriaxone-2026]
