drug: cefepime
drug_name: Cefepime
indication: Sepsis or septic shock
indication_detail: Sepsis or septic shock needing antipseudomonal coverage.
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 8 hours
rate: "over 3–4 hours after a first dose over 30 minutes"
adjustments:
  - when: CrCl 30–60 mL/min
    change: 2 g every 12 hours
  - when: CrCl 11–29 mL/min
    change: 2 g every 24 hours
  - when: CrCl <11 mL/min
    change: 1 g every 24 hours
  - when: Hemodialysis
    change: 1 g every 24 hours, after dialysis on dialysis days
  - when: Peritoneal dialysis (CAPD)
    change: 2 g every 48 hours
notes: "Extended infusion = each dose over at least half the dosing interval, or continuous. Recommended in sepsis after a loading dose (labels give short infusions). Label: 2 g every 8 hours for empiric febrile neutropenia and Pseudomonas pneumonia."
sources: [label-cefepime-2026, ssc-sepsis-2026, idsa-sepsis-hospital-2026]
verification:
  source: label-cefepime-2026
  read: not-verified
  date: 2026-10-23
