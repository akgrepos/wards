drug: digoxin
drug_name: Digoxin
brand: Lanoxin
indication: Acute rate control of AF
indication_detail: Acute rate control of AF in heart failure or hypotension.
population: Adults
route: IV
amount: "0.25–0.5"
unit: mg
rate: over at least 5 minutes
repeat: "0.25 mg every 6 hours as needed"
max: "1.5 mg in 24 hours"
give_when: LVEF ≤40%, decompensated heart failure or hypotension. Add-on when one agent is insufficient
adjustments:
  - when: Kidney impairment
    change: Smaller maintenance doses by CrCl and lean body weight. Check levels (not removed by dialysis)
cautions:
  - "Slow onset. Ineffective when adrenergic tone is high."
notes: "Label loading: 8–12 mcg/kg lean body weight in total, half first, then a quarter every 6–8 hours twice. Levels above 2 ng/mL add toxicity without benefit, and the AF guideline notes higher mortality above 1.2 ng/mL: aim lower. Draw at least 6 hours after a dose."
sources: [acc-aha-af-2023, label-lanoxin-inj-2025]
verification:
  source: label-lanoxin-inj-2025
  read: not-verified
  date: 2026-10-23
