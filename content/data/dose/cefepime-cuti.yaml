drug_name: Cefepime
indication: Complicated UTI or pyelonephritis
population: Adults
route: IV
amount: 1–2
unit: g
frequency: every 8–12 hours
rate: over about 30 minutes
adjustments:
  - when: CrCl ≤60 mL/min
    change: Reduce per the label's table (e.g., 2 g every 12 hours becomes 2 g every 24 hours at CrCl 30–60)
cautions:
  - Neurotoxicity when not reduced for kidney function.
notes: "Range from the guideline's trial-dose table; the label's UTI dosing is every 12 hours (severe: 2 g every 12 hours), with every 8 hours labeled for Pseudomonas and pneumonia."
sources:
  - idsa-cuti-selection-2025
  - label-cefepime-2024
verification:
