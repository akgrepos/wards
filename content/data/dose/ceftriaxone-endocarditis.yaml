drug: ceftriaxone
drug_name: Ceftriaxone
indication: Native-valve endocarditis
indication_detail: Native-valve endocarditis from penicillin-susceptible viridans group streptococci or Streptococcus gallolyticus, or from HACEK organisms
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 24 hours
duration: 4 weeks, counted from clearance of bacteremia. Prosthetic valve (streptococcal or HACEK) 6 weeks.
boxed_warning: None
cautions:
  - "Penicillin-intermediate streptococci: ceftriaxone alone only if the strain is ceftriaxone-susceptible. Fully resistant: add gentamicin for the first 2 weeks."
  - "Enterococcus faecalis is a different regimen: ampicillin plus ceftriaxone 2 g every 12 hours for 6 weeks, native or prosthetic valve."
  - Duration and agent are set with infectious diseases and cardiology.
sources: [aha-ie-2026, label-ceftriaxone-2026]
verification:
  source: aha-ie-2026
  read: full-text
  date: 2026-10-24
