drug: potassium-chloride
drug_name: Potassium chloride
indication: Hypokalemia, rapid oral replacement
indication_detail: Hypokalemia with K⁺ <3.0 mEq/L and a working gut.
population: Adults
route: PO
amount: "40"
unit: mEq
frequency: "every 3–4 hours for 3 doses"
give_when: "K⁺ <3.0 mEq/L without an indication for IV"
repeat: "Recheck K⁺ (no sooner than 2 hours after a dose) before giving more"
max: "40 mEq per dose. 200 mEq per day (oral solution label)"
alternative:
  dose: kcl-iv-standard
  when: "No oral route"
notes: "Oral replacement is preferred: lower risk of rebound hyperkalemia than IV. Arrhythmia, digitalis toxicity, ischemia, paralysis or K⁺ <2.5 mEq/L: use the monitored IV dose instead."
sources: [asmar-hypokalemia-2012, label-klor-con-2025, label-kcl-oral-solution-2026]
verification:
  source: label-klor-con-2025
  read: not-verified
  date: 2026-10-23
