drug: ipratropium
drug_name: Ipratropium (nebulized)
indication: COPD exacerbation
indication_detail: COPD exacerbation, added to albuterol.
population: Adults
route: nebulized
amount: "0.5"
unit: mg
frequency: every 6–8 hours
give_when: With albuterol at the start of an exacerbation
cautions:
  - "If a long-acting muscarinic antagonist (e.g. tiotropium) is continued, ipratropium adds little."
notes: "Labeled for maintenance treatment of COPD bronchospasm, 500 mcg three to four times daily, 6–8 hours apart. Use in exacerbations follows the guideline. The label says adding it to a beta-agonist has not been shown better than either alone in acute exacerbations. Combined vial with albuterol (0.5 mg/2.5 mg): one vial four times daily, up to two extra vials a day (label)."
sources: [gold-copd-2026, label-ipratropium-neb-2026]
verification:
