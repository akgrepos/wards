drug: cefepime
drug_name: Cefepime
indication: Community-acquired pneumonia with Pseudomonas risk
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 8 hours
rate: over about 30 minutes
adjustments:
  - when: CrCl 30–60 mL/min
    change: 2 g every 12 hours
  - when: CrCl 11–29 mL/min
    change: 2 g every 24 hours
  - when: CrCl <11 mL/min
    change: 1 g every 24 hours
  - when: Hemodialysis
    change: 1 g every 24 hours, after dialysis on dialysis days
  - when: Peritoneal dialysis (CAPD)
    change: 2 g every 48 hours
sources:
  - idsa-ats-cap-2019
  - label-cefepime-2026
verification:
  source: label-cefepime-2026
  read: not-verified
  date: 2026-10-23
