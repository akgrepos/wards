drug_name: Cefpodoxime
indication: Community-acquired pneumonia, outpatient with comorbidities (with a macrolide or doxycycline)
population: Adults
route: PO
amount: "200"
unit: mg
frequency: every 12 hours
adjustments:
  - when: CrCl <30 mL/min
    change: Every 24 hours
  - when: Hemodialysis
    change: 3 times a week after dialysis
cautions:
  - Take with food.
sources:
  - idsa-ats-cap-2019
  - label-cefpodoxime-2026
verification:
  source: label-cefpodoxime-2026
  read: not-verified
