drug: bromocriptine
drug_name: Bromocriptine
brand: Parlodel
indication: Neuroleptic malignant syndrome
indication_detail: Moderate to severe NMS, with supportive care and benzodiazepines. Off-label.
population: Adults
route: oral or nasogastric tube (no parenteral form)
amount: 2.5
unit: mg
frequency: "2 to 3 times a day, raised by 2.5 mg every 24 hours until response"
give_when: Moderate to severe NMS
duration: "Continue for 10 days after symptoms are controlled, then taper slowly. Continue 2–3 weeks after a depot antipsychotic"
max: "45 mg a day"
cautions:
  - "Confirm NMS first. Not for serotonin syndrome."
  - "May worsen psychosis and cause hypotension."
  - "Stopping too early can bring NMS back."
notes: "Case-report and case-series evidence only. Start, titration, ceiling and duration from the 2021 review text. Its staging table uses a lower ceiling of 15 mg a day. The label does not cover NMS."
sources: [wadoo-nms-2021, pileggi-nms-2016, label-bromocriptine-2026]
verification:
  source: wadoo-nms-2021
  read: full-text
  date: 2026-10-25
