drug_name: Vasopressin
brand: Vasostrict
indication: Septic shock, added to norepinephrine
population: Adults
route: IV
amount: "0.01"
unit: units/min
rate: "continuous infusion; titrate up by 0.005 units/min every 10–15 minutes to the MAP target"
give_when: "Rising norepinephrine requirement"
max: "Label: limited data above 0.07 units/min in septic shock"
cautions:
  - "Digital, mesenteric and myocardial ischemia; hyponatremia."
  - "Reversible diabetes insipidus after stopping: watch Na⁺ and urine output."
notes: "Trials and the 2021 guideline used a fixed 0.03 units/min. Weaning (label): once the target is held for 8 hours without catecholamines, lower by 0.005 units/min every hour."
sources: [label-vasostrict-2026, ssc-sepsis-2026, ssc-sepsis-2021, vasst-2008]
