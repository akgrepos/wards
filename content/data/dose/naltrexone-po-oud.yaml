drug: naltrexone
drug_name: Naltrexone
indication: Opioid blockade, oral
indication_detail: Blockade of exogenous opioids in a patient who is opioid-free. Oral naltrexone is not recommended except in limited circumstances.
population: Adults
route: PO
amount: 50
unit: mg
frequency: "once daily. Start with 25 mg, then 50 mg daily if no withdrawal signs."
