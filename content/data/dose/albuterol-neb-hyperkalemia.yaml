drug_name: Albuterol (nebulized)
indication: Adjunct for moderate or severe hyperkalemia
population: Adults
route: nebulized
amount: 10–20
unit: mg
frequency: once
onset: About 30 minutes
lasts: About 2 hours
cautions:
  - "Use with insulin-glucose; never alone for severe hyperkalemia."
  - "Much larger dose than for bronchospasm; watch for tachycardia."
notes: "Peak potassium lowering around 90–120 minutes."
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020, emcreg-hyperkalemia-2025]
