drug: albuterol
drug_name: Albuterol (nebulized)
indication: Moderate or severe hyperkalemia
indication_detail: Adjunct for moderate or severe hyperkalemia.
population: Adults
route: nebulized
amount: 10–20
unit: mg
frequency: once
onset: Within 30 minutes
lasts: At least 2 hours
cautions:
  - "Use with insulin-glucose. Never alone for severe hyperkalemia."
  - "Much larger dose than for bronchospasm. Watch for tachycardia and tremor."
  - "Cardiac disease: use the lower dose with monitoring."
notes: "Peak potassium lowering at about 120 minutes (10 mg) and 90 minutes (20 mg). Response varies: 20–40% of patients drop K⁺ by less than 0.5 mEq/L."
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020, emcreg-hyperkalemia-2025]
