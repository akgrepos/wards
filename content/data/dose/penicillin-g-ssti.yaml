drug_name: Penicillin G potassium
indication: Moderate cellulitis or erysipelas. Streptococcal necrotizing infection (with clindamycin)
population: Adults
route: IV
amount: 2–4 million
unit: units
frequency: every 4–6 hours
adjustments:
  - when: Uremia with CrCl >10 mL/min
    change: Full loading dose, then half the loading dose every 4–5 hours
  - when: CrCl <10 mL/min
    change: Full loading dose, then half the loading dose every 8–10 hours
  - when: Liver and kidney disease together
    change: Further reduction may be needed (label)
cautions:
  - High doses carry a potassium load.
sources:
  - idsa-ssti-2014
  - label-penicillin-g-2025
verification:
  source: label-penicillin-g-2025
  read: not-verified
  date: 2026-10-23
