drug: doxycycline
drug_name: Doxycycline
indication: Community-acquired pneumonia (with a β-lactam, or alone in healthy outpatients). MRSA skin infection. COPD exacerbation
population: Adults
route: PO or IV
amount: "100"
unit: mg
frequency: every 12 hours
cautions:
  - "IV: infuse over at least 1 hour."
notes: Some experts give 200 mg for the first dose. Activity against β-hemolytic streptococci is uncertain.
