drug_name: Furosemide
indication: Hyperkalemia in patients who make urine, especially with volume overload
population: Adults
route: IV
amount: 40–80
unit: mg
frequency: once
give_when: Non-oliguric, especially with volume overload
onset: About 15 minutes
lasts: 2–3 hours
cautions:
  - "Avoid in hypovolemia or oliguria."
notes: "Efficacy for acute hyperkalemia hasn't been studied. Most useful with volume overload."
sources: [emcreg-hyperkalemia-2025, kdigo-acute-hyperkalemia-2020]
verification:
  source: emcreg-hyperkalemia-2025
  read: not-verified
  date: 2026-10-23
