drug: vancomycin
drug_name: Vancomycin
indication: Meningitis or ventriculitis
indication_detail: Bacterial meningitis or healthcare-associated ventriculitis and meningitis.
population: Adults
route: IV
amount: "15"
unit: mg/kg
frequency: every 8–12 hours
rate: over at least 60 minutes
give_when: Actual body weight. Pharmacist-led dosing
adjustments:
  - when: Kidney impairment or dialysis
    change: Dose by levels with the pharmacy
cautions:
  - Target trough 15–20 mcg/mL in meningitis (IDSA 2004, 2017).
  - Never alone in pneumococcal meningitis.
notes: "IDSA 2004 lists 30–45 mg/kg a day in divided doses every 8–12 hours (15 mg/kg every 8–12 hours). Dose by levels with the pharmacy."
sources: [idsa-meningitis-2004, idsa-ventriculitis-2017, label-vancomycin-2025]
verification:
  source: idsa-meningitis-2004
  read: not-verified
  date: 2026-10-23
