drug_name: Crystalloid (balanced crystalloid or 0.9% saline)
indication: Fluid resuscitation for hypovolemia or hypoperfusion
population: Adults
route: IV
amount: "500"
unit: mL
rate: "over less than 15 minutes"
give_when: "Signs of hypovolemia or hypoperfusion (e.g. SBP <100 mm Hg, HR >90, capillary refill >2 s or cold peripheries, RR >20)"
repeat: "Reassess after each bolus (perfusion, fluid responsiveness, lungs). Repeat only while the patient still responds and needs it"
cautions:
  - "Use a crystalloid with Na⁺ 130–154 mEq/L."
  - "Heart failure, kidney failure or frailty: smaller volumes and more frequent reassessment."
  - "Hemorrhage: blood products, not crystalloid alone."
notes: "Balanced crystalloids (LR, Plasma-Lyte) are suggested over saline in sepsis, except with traumatic brain injury (0.9% saline)."
sources: [nice-iv-fluids-2017, ssc-sepsis-2026, common-practice]
verification:
  source: nice-iv-fluids-2017
  read: not-verified
  date: 2026-10-23
