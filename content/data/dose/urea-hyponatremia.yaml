drug: urea
drug_name: Urea (oral)
brand: "ure-Na (medical food)"
indication: Chronic hyponatremia from SIADH not corrected by fluid restriction
population: Adults
route: PO
amount: "15–60"
unit: g
frequency: daily
give_when: "SIADH when fluid restriction fails or is unlikely to work"
repeat: "Increase by 15 g per day at weekly intervals as needed"
cautions:
  - "Poor palatability and gastric intolerance. Dissolve in juice or another strongly flavored drink."
notes: "Second-line in both the US and European guidelines. Raises free-water excretion by osmotic diuresis."
sources: [verbalis-hyponatremia-2013, hoorn-hyponatremia-guidelines-2017, adrogue-hyponatremia-2022]
verification:
  source: verbalis-hyponatremia-2013
  read: not-verified
  date: 2026-10-23
