drug_name: Potassium chloride
indication: Prevention of hypokalemia (e.g. on loop or thiazide diuretics)
population: Adults
route: PO
amount: "20"
unit: mEq
frequency: once daily
boxed_warning: None
notes: "The label's typical dose; individualize to serum K⁺. A potassium-sparing diuretic is an alternative to supplements."
