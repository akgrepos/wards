drug_name: Ciprofloxacin
indication: Complicated UTI or pyelonephritis
population: Adults
route: IV
amount: "400"
unit: mg
frequency: every 12 hours
rate: over 60 minutes
boxed_warning: "Fluoroquinolones: disabling and potentially irreversible tendinitis and tendon rupture, peripheral neuropathy and CNS effects, and worsening of myasthenia gravis; stop at the first sign."
adjustments:
  - when: CrCl 5–29 mL/min
    change: 200–400 mg every 18–24 hours
cautions:
  - Avoid if a fluoroquinolone was used in the last 12 months or a prior isolate was resistant.
  - QT prolongation; raises tizanidine and theophylline levels.
sources:
