drug: enoxaparin
drug_name: Enoxaparin
brand: Lovenox
indication: Acute DVT or PE treatment, and bridging
population: Adults
route: SC
amount: "1"
unit: mg/kg
frequency: every 12 hours (or 1.5 mg/kg once daily in hospitalized patients)
duration: "At least 5 days and until INR is therapeutic if overlapped with warfarin"
adjustments:
  - when: CrCl <30 mL/min
    change: 1 mg/kg once daily
  - when: Obesity
    change: Use actual body weight. Consider individualizing above 150 kg
  - when: Pregnancy
    change: "1 mg/kg every 12 hours. No routine anti-Xa monitoring (mechanical valves: peak 0.8–1.2 units/mL, 4–6 hours after the dose)"
cautions:
  - "Accumulates in kidney failure: prefer unfractionated heparin if CrCl <30 mL/min and unstable or high bleeding risk."
sources: [label-lovenox-2026, chest-vte-2021, ash-vte-pregnancy-2018, acc-aha-valvular-2020]
verification:
  source: label-lovenox-2026
  read: not-verified
  date: 2026-10-23
