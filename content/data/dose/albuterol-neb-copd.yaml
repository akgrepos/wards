drug_name: Albuterol (nebulized)
indication: COPD exacerbation, initial bronchodilator (with or without ipratropium)
population: Adults
route: nebulized
amount: "2.5"
unit: mg
frequency: every hour for 2–3 doses, then every 2–4 hours by response
give_when: All patients with an exacerbation
onset: Within 5 minutes
cautions:
  - "Air-driven nebulizer preferred in hypercapnia risk (oxygen-driven nebulization can raise PaCO₂); give oxygen by nasal cannula during it."
  - "A metered-dose inhaler with spacer works as well as a nebulizer; nebulizers may be easier for sicker patients."
  - "Avoid high doses: tachycardia, tremor, hypokalemia."
notes: "Label dose 2.5 mg three to four times daily; the more frequent guideline schedule for exacerbations is beyond the label. No kidney or liver adjustment."
sources: [gold-copd-2026, label-albuterol-neb-2026, bts-oxygen-2017]
