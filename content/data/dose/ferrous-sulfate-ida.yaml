drug: ferrous-sulfate
drug_name: Ferrous sulfate
indication: Iron deficiency anemia
indication_detail: Oral replacement for iron deficiency anemia.
population: Adults
route: PO
amount: "325"
unit: mg
frequency: once daily or every other day
duration: "Until hemoglobin normalizes, then about 3 months more to replenish stores"
cautions:
  - "Constipation, nausea and dark stools are common. Every-other-day dosing may be better tolerated and absorbed."
notes: "A 325 mg tablet contains 65 mg of elemental iron. Over-the-counter product. No FDA prescribing information. Dosing follows absorption studies and common practice."
sources: [stoffel-iron-2017, common-practice]
