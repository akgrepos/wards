drug: albumin
drug_name: Albumin 25%
indication: Spontaneous bacterial peritonitis, with antibiotics (day 1)
population: Adults
route: IV
amount: "1.5"
unit: g/kg
frequency: "once on day 1"
give_when: "SBP. Greatest benefit with AKI or jaundice"
alternative:
  dose: albumin-sbp-day3
  when: "Second dose on day 3"
cautions:
  - "Label: with normal blood volume, infuse no faster than about 1 mL per minute. No more than 2 g/kg per day."
notes: "In the trial, benefit was greatest with BUN >30 mg/dL, creatinine >1.0 mg/dL or bilirubin >5 mg/dL."
