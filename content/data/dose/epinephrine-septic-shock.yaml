drug: epinephrine
drug_name: Epinephrine
brand: Adrenalin
indication: Septic shock
indication_detail: Septic shock, added when MAP is inadequate on norepinephrine plus vasopressin.
population: Adults
route: IV
amount: 0.05–2
unit: mcg/kg/min
rate: "continuous infusion. Adjust by 0.05–0.2 mcg/kg/min every 10–15 minutes"
give_when: "MAP inadequate despite norepinephrine plus vasopressin. With cardiac dysfunction, an alternative first line (preferred with bradycardia)"
cautions:
  - "Extravasation: infiltrate with phentolamine 5–10 mg in 10–15 mL saline (within 12 hours)."
notes: "Label dilution: 1 mg in 1,000 mL 5% dextrose (1 mcg/mL). Septic shock is a labeled indication."
sources: [label-adrenalin-2026, ssc-sepsis-2026]
verification:
