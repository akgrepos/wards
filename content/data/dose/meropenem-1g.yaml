drug: meropenem
drug_name: Meropenem
indication: Pneumonia, complicated UTI, severe skin infection
indication_detail: Pneumonia with Pseudomonas risk, complicated UTI with sepsis or resistant organisms, and severe or necrotizing skin infection.
population: Adults
route: IV
amount: "1"
unit: g
frequency: every 8 hours
rate: over 15–30 minutes
adjustments:
  - when: CrCl 26–50 mL/min
    change: 1 g every 12 hours
  - when: CrCl 10–25 mL/min
    change: 500 mg every 12 hours
  - when: CrCl <10 mL/min
    change: 500 mg every 24 hours
