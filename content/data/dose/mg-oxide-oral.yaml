drug: magnesium-oxide
drug_name: Magnesium oxide
indication: Mild or asymptomatic hypomagnesemia
indication_detail: Hypomagnesemia that is mild or asymptomatic, or maintenance after IV.
population: Adults
route: PO
amount: "400"
unit: mg
frequency: "1–2 times daily to start. Up to 3 times daily as tolerated"
adjustments:
  - when: "Kidney failure"
    change: "Avoid or reduce. Monitor Mg (risk of hypermagnesemia)"
cautions:
  - "Magnesium hydroxide is a laxative: not for repletion."
notes: "Each 400 mg tablet has 241 mg of elemental magnesium. Aim for at least about 300 mg of elemental magnesium a day in divided doses. Organic salts (e.g. citrate) may be better absorbed. Evidence is weak."
sources: [adomako-magnesium-2024, hansen-magnesium-icu-2018]
verification:
  source: adomako-magnesium-2024
  read: not-verified
  date: 2026-10-23
