drug: meropenem
drug_name: Meropenem
indication: Sepsis or septic shock
indication_detail: Sepsis or septic shock with risk of resistant gram-negative organisms, for example ESBL.
population: Adults
route: IV
amount: "1"
unit: g
frequency: every 8 hours
rate: "over 3–4 hours after a first dose over 15–30 minutes"
adjustments:
  - when: CrCl 26–50 mL/min
    change: 1 g every 12 hours
  - when: CrCl 10–25 mL/min
    change: 500 mg every 12 hours
  - when: CrCl <10 mL/min
    change: 500 mg every 24 hours
  - when: Hemodialysis
    change: Not in the label. Dose with the pharmacy
notes: "Extended infusion = each dose over at least half the dosing interval, or continuous. Recommended in sepsis after a loading dose (labels give short infusions). Label: 1 g every 8 hours for intra-abdominal infection."
sources: [label-meropenem-2024, ssc-sepsis-2026, idsa-sepsis-hospital-2026]
verification:
  source: label-meropenem-2024
  read: not-verified
  date: 2026-10-23
