drug: metoprolol
drug_name: Metoprolol tartrate
brand: Lopressor
indication: Ongoing rate control of AF
population: Adults
route: PO
amount: "25–100"
unit: mg
frequency: twice daily
give_when: Once rate controlled with IV therapy, or as initial oral therapy in stable patients
adjustments:
  - when: Liver impairment
    change: Start low and titrate gradually
cautions:
  - "Take with or right after meals."
  - "Inpatients are often started on the same total daily dose divided every 6 hours, then consolidated."
notes: "AF is not a labeled indication. The AF guideline range is 25–200 mg twice daily. Start low. Kidney impairment: no adjustment."
sources: [acc-aha-af-2023, label-lopressor-2023]
verification:
  source: acc-aha-af-2023
  read: not-verified
  date: 2026-10-23
