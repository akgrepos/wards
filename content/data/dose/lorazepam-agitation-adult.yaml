drug_name: Lorazepam
brand: Ativan
indication: Agitation from alcohol or benzodiazepine withdrawal, stimulant intoxication or undifferentiated agitation. Added to an antipsychotic when it is not enough (off-label)
population: Adults
route: Oral, IM or IV
amount: 1–2
unit: mg
frequency: once. Reassess before any repeat dose
give_when: Withdrawal or sedative-hypnotic withdrawal, stimulant intoxication, or severe agitation with an antipsychotic
repeat: "May repeat after 2 hours if needed (consensus table). IV acts within minutes"
max: "Consensus table: 12 mg in 24 hours. Lower with other sedatives. Alcohol withdrawal is dosed by symptom score"
boxed_warning: "Concomitant use with opioids can cause profound sedation, respiratory depression, coma and death. Risks of abuse, misuse and addiction, and of dependence and withdrawal reactions."
cautions:
  - "Avoid in delirium unless the cause is alcohol or sedative withdrawal, catatonia or seizure."
  - "Avoid when a central nervous system depressant (including alcohol) is the cause. Respiratory depression."
  - "Avoid a parenteral dose with IM olanzapine (olanzapine label: not recommended)."
  - "Repeated IM doses accumulate unpredictably. Observe airway, oxygen saturation and sedation."
notes: "Dose, interval and maximum from the AAEP consensus table. The label covers preanesthetic sedation and status epilepticus, not agitation. For withdrawal dosing by symptom score, see the Alcohol Withdrawal card."
sources: [label-ativan-inj-2026, aaep-beta-psychopharm-2012, acep-severe-agitation-2023]
