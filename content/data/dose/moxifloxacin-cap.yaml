drug_name: Moxifloxacin
indication: Community-acquired pneumonia
population: Adults
route: PO
amount: "400"
unit: mg
frequency: every 24 hours
boxed_warning: "Fluoroquinolones: disabling and potentially irreversible tendinitis and tendon rupture, peripheral neuropathy and CNS effects, and worsening of myasthenia gravis; stop at the first sign."
cautions:
  - No dose change for kidney impairment or dialysis (label).
  - QT prolongation; little urinary excretion, so not for UTI.
  - Separate from antacids and metal cations.
sources:
