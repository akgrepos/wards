drug: dantrolene
drug_name: Dantrolene
brand: Dantrium
indication: Neuroleptic malignant syndrome
indication_detail: Severe NMS with rigidity and hyperthermia despite supportive care. Off-label.
population: Adults
route: IV
amount: 1–2.5
unit: mg/kg
frequency: "bolus, then 1 mg/kg every 6 hours"
give_when: Severe NMS, with benzodiazepines and bromocriptine
max: "10 mg/kg a day"
duration: "Usually stopped once symptoms begin to resolve, because of hepatotoxicity"
cautions:
  - "Evidence is mixed. Some reviews report higher mortality with dantrolene alone."
  - "The label states it is not indicated for NMS and patients may die despite treatment."
notes: "Dose from the 2021 NMS review. The label dose is for malignant hyperthermia (1 mg/kg minimum, to a cumulative 10 mg/kg). Not used in serotonin syndrome."
sources: [wadoo-nms-2021, label-dantrium-iv-2026]
verification:
  source: wadoo-nms-2021
  read: full-text
  date: 2026-10-25
