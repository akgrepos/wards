drug: sodium-chloride-3
drug_name: Sodium chloride 3% (hypertonic saline)
indication: Chronic symptomatic hyponatremia, infusion
indication_detail: Chronic hyponatremia with moderate symptoms (for example nausea or confusion), given as a continuous infusion.
population: Adults
route: IV
amount: "1–1.5"
unit: mL/kg
rate: "over 6 hours, as a continuous infusion"
give_when: "Moderate symptoms without seizures, coma or signs of herniation"
repeat: "Serum Na⁺ every 4–6 hours. Adjust to a rise of 4–8 mEq/L per day (4–6 at high risk of osmotic demyelination)"
max: "Na⁺ rise ≤10–12 mEq/L in any 24 h (≤8 mEq/L at high risk of osmotic demyelination)"
cautions:
  - "Watch urine output: a water diuresis can raise Na⁺ quickly. With hypovolemia or low solute intake, an expert review gives desmopressin alongside."
notes: "Example: 80 kg × 1.5 mL/kg = 120 mL over 6 hours (20 mL/h). The European guideline instead gives a single 150 mL bolus for moderately severe symptoms."
sources: [rondon-berrios-hypertonic-2022, hoorn-hyponatremia-guidelines-2017, verbalis-hyponatremia-2013]
verification:
  source: rondon-berrios-hypertonic-2022
  read: not-verified
  date: 2026-10-23
