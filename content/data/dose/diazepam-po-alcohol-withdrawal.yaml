drug: diazepam
drug_name: Diazepam
brand: Valium
indication: Alcohol withdrawal, oral
indication_detail: Alcohol withdrawal, oral, given as symptom-triggered or front-loaded dosing.
population: Adults who can take oral medication
route: PO
amount: 10–20
unit: mg
frequency: "front loading driven by the CIWA-Ar: 10–20 mg every 1–2 hours until the CIWA-Ar is below 10. Fixed front loading: 20 mg every 2 hours for 3 doses"
give_when: CIWA-Ar ≥10, especially severe (≥19) or high-risk withdrawal
duration: "Stop once the CIWA-Ar is below 10 and stays low. Do not continue as a prescription after treatment"
max: "No fixed ceiling in hospital. Reassess sedation before each dose. ASAM (primary care): not controlled after an adequate dose, for example 80 mg, means transfer to the emergency department or inpatient care"
adjustments:
  - when: "Older or debilitated adults"
    change: "Label: 2–2.5 mg once or twice daily initially. Use the low end and reassess before each dose"
  - when: "Cirrhosis"
    change: "Half-life prolonged 2- to 5-fold. Contraindicated in severe hepatic insufficiency (label). ASAM: reduce the dose or use a benzodiazepine with less hepatic metabolism"
notes: "ASAM examples: 10 mg every hour if the CIWA-Ar is 10 or higher, 20 mg every hour until the CIWA-Ar is below 10, or 20 mg every 2 hours for 3 doses. Alcohol withdrawal is a labeled use: 10 mg 3 or 4 times in the first 24 hours, then 5 mg 3 or 4 times daily as needed."
sources: [asam-alcohol-withdrawal-2020, label-valium-2025]
verification:
  source: label-valium-2025
  read: not-verified
  date: 2026-10-23
