drug_name: Diazepam
brand: Valium
indication: Alcohol withdrawal, symptom-triggered or front-loaded (oral)
population: Adults who can take oral medication
route: PO
amount: 10–20
unit: mg
frequency: "every 1–2 hours while the CIWA-Ar is 10 or higher (symptom-triggered), or 20 mg every 2 hours for 3 doses (front loading)"
give_when: CIWA-Ar ≥10 (symptom-triggered), or severe or high-risk withdrawal (front loading)
duration: "Stop once the CIWA-Ar is below 10 and stays low; do not continue as a prescription after treatment"
max: "ASAM: a patient not controlled after an adequate dose (for example 80 mg) needs a higher level of care"
boxed_warning: "Concomitant use with opioids can cause profound sedation, respiratory depression, coma and death; abuse, misuse and addiction; dependence and withdrawal reactions."
adjustments:
  - when: "Older or debilitated adults"
    change: "Label: 2–2.5 mg once or twice daily initially; use the low end and reassess before each dose"
  - when: "Cirrhosis"
    change: "Half-life prolonged 2- to 5-fold; titrate to effect and watch for accumulation; contraindicated in severe hepatic insufficiency (label)"
cautions:
  - "Long-acting metabolites accumulate with repeated large doses, especially in older adults and liver disease; reassess sedation before every dose."
  - "Contraindicated in myasthenia gravis, severe respiratory insufficiency, severe hepatic insufficiency and sleep apnea syndrome (label)."
notes: "ASAM examples: 10 mg every hour if the CIWA-Ar is 10 or higher, or 20 mg every 2 hours for 3 doses. Alcohol withdrawal is a labeled use: 10 mg 3 or 4 times in the first 24 hours, then 5 mg 3 or 4 times daily as needed."
sources: [asam-alcohol-withdrawal-2020, label-valium-2025]
