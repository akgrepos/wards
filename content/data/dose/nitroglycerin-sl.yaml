drug_name: Nitroglycerin
brand: Nitrostat
indication: Ischemic chest pain
population: Adults
route: SL
amount: "0.4"
unit: mg
frequency: every 5 minutes as needed
max: "3 doses in 15 minutes"
cautions:
  - "Contraindicated with a phosphodiesterase-5 inhibitor (avanafil within 12 hours; sildenafil or vardenafil within 24 hours; tadalafil within 48 hours) or riociguat, shock, or raised intracranial pressure."
  - "Avoid with SBP <90 mm Hg or suspected RV infarction."
  - "Give seated or lying."
sources: [label-nitrostat-2023, acc-aha-acs-2025]
