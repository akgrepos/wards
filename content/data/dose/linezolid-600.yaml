drug_name: Linezolid
indication: MRSA pneumonia or skin infection
population: Adults
route: IV or PO
amount: "600"
unit: mg
frequency: every 12 hours
cautions:
  - "IV: infuse over 30–120 minutes; oral and IV doses are the same."
  - No dose change for kidney impairment (label).
  - Serotonin syndrome with SSRIs, SNRIs and other serotonergic drugs.
  - "Myelosuppression, especially beyond 2 weeks or with severe kidney impairment: weekly CBC."
  - Lactic acidosis, hypoglycemia in diabetes, hyponatremia, peripheral and optic neuropathy with long courses.
sources:
