drug: furosemide
drug_name: Furosemide
brand: Lasix
indication: Congestion in acute decompensated heart failure
population: Adults
route: IV
amount: "20–40"
unit: mg
frequency: "2–3 times daily as boluses, or as a continuous infusion"
give_when: "Diuretic-naive. On a home loop diuretic: IV dose 1–2.5 times the total daily oral dose (US: at least 1 times, ESC: 1–2 times, DOSE high-dose arm: 2.5 times)"
repeat: "Double the dose if the 2-hour urine Na⁺ or 6-hour urine output is inadequate"
max: "400–600 mg per day IV (heart failure position statement). Higher only with cardiology or nephrology"
rate: "bolus over 1–2 minutes. Infusion: the same total daily dose spread over 24 hours, never faster than 4 mg/min (label)"
onset: About 5 minutes
cautions:
  - "Hypokalemia, hypomagnesemia, hyponatremia, contraction alkalosis. Check BMP and Mg²⁺ daily."
notes: "2026 European guideline: diuretic-naive patients usually respond to 40 mg IV. On a home loop diuretic, consider twice the usual oral dose IV. Oral furosemide is about half as bioavailable as IV. Approximate equivalents: furosemide 40 mg PO = 20 mg IV = bumetanide 1 mg (PO or IV) = torsemide 10–20 mg PO."
