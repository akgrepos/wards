drug_name: Gabapentin
brand: Neurontin
indication: Mild to moderate alcohol withdrawal when benzodiazepines are contraindicated, or as an adjunct (off-label)
population: Adults with adequate kidney function
route: PO
amount: 400
unit: mg
frequency: "every 6–8 hours as an adjunct. Monotherapy 1200 mg load, then 600 mg every 6 hours on day 1, or 1200 mg a day for 1–3 days then tapered to 300–600 mg a day over 4–7 days"
give_when: Mild or moderate withdrawal, including when benzodiazepines are contraindicated, or as a benzodiazepine adjunct. Favored when treatment of alcohol use disorder with gabapentin is also planned
adjustments:
  - when: "Reduced creatinine clearance"
    change: "Reduce the dose according to the label's renal table"
cautions:
  - "Respiratory depression with other CNS depressants (benzodiazepines, opioids) or underlying respiratory impairment (label)."
  - "Not for complicated withdrawal, seizures from withdrawal or delirium."
notes: "Not labeled for alcohol withdrawal. ASAM Appendix V sample regimens."
sources: [asam-alcohol-withdrawal-2020, label-gabapentin-2026]
verification:
  source: asam-alcohol-withdrawal-2020
  read: not-verified
  date: 2026-10-23
