drug_name: Dexmedetomidine
brand: Precedex
indication: Autonomic hyperactivity or benzodiazepine-resistant withdrawal in the ICU, as an adjunct only (off-label)
population: Adults in the ICU with continuous monitoring
route: IV infusion
amount: 0.4–1.2
unit: mcg/kg/h
rate: "fixed doses in the trial; titrate to the sedation target and avoid a bolus"
give_when: Autonomic hyperactivity not controlled by benzodiazepines, never as the only agent
duration: "Label: continuous infusion not to exceed 24 hours"
cautions:
  - "Bradycardia, hypotension and sinus pause; it does not prevent seizures or treat delirium."
  - "Masks signs of withdrawal, so keep giving benzodiazepines as needed."
notes: "RCT of 24 patients (Mueller 2014): less lorazepam in the first 24 hours, no difference over 7 days, bradycardia in 25% vs 0%. ASAM allows alpha-2 agonists only for autonomic hyperactivity and says they should not be used alone."
sources: [asam-alcohol-withdrawal-2020, mueller-dexmedetomidine-2014, label-precedex-2026]
