drug_name: Piperacillin-tazobactam
indication: Complicated UTI or pyelonephritis
population: Adults
route: IV
amount: "4.5"
unit: g
frequency: every 8 hours
rate: over 30 minutes
adjustments:
  - when: CrCl ≤40 mL/min or dialysis
    change: Reduce per the label's kidney table, with the pharmacy
notes: Dose used in the complicated UTI trials the guideline reviewed; the label's general adult dose is 3.375 g every 6 hours and does not list UTI.
sources:
  - idsa-cuti-selection-2025
  - label-zosyn-2026
