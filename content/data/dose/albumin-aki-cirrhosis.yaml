drug_name: Albumin 25%
indication: "AKI in cirrhosis with ascites, stage >1A (ICA) or progressing: volume expansion after diuretic withdrawal"
route: IV
amount: 1
unit: g/kg
frequency: daily
duration: 2 days
max: 100 g/day
cautions:
  - "Watch for volume overload and pulmonary edema."
notes: "Given as a 48-hour volume challenge after diuretics are stopped and precipitants (e.g. infection) treated. If SCr does not improve after 2 days and stage 2 or higher HRS-AKI criteria are met, treat with a vasoconstrictor plus albumin."
sources: [aasld-ascites-hrs-2021, aasld-aclf-2024]
verification:
  source: aasld-ascites-hrs-2021
  read: not-verified
  date: 2026-10-23
