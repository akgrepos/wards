drug_name: Lorazepam
brand: Ativan
indication: Alcohol withdrawal in liver disease, older adults or when a short-acting benzodiazepine is preferred (off-label)
population: Adults
route: PO or IV
amount: 1–2
unit: mg
frequency: "every 1–4 hours as needed while the CIWA-Ar is 10 or higher; reassess sedation before each dose"
give_when: CIWA-Ar ≥10 in significant liver disease or older age
boxed_warning: "Concomitant use with opioids can cause profound sedation, respiratory depression, coma and death; abuse, misuse and addiction; dependence and withdrawal reactions."
cautions:
  - "Not labeled for alcohol withdrawal; the injection is labeled for status epilepticus and preanesthetic use."
  - "Shorter-acting: breakthrough symptoms and rebound are more likely, so frequent reassessment or a fixed schedule is needed."
  - "The injection contains propylene glycol and benzyl alcohol; with repeated high IV doses watch for hyponatremia and metabolic acidosis."
notes: "Glucuronidated without CYP oxidation, so clearance is little changed in cirrhosis. ASAM: benzodiazepines that are not hepatically metabolized (lorazepam, oxazepam) may be more appropriate in significant liver disease."
sources: [asam-alcohol-withdrawal-2020, label-ativan-inj-2026, common-practice]
