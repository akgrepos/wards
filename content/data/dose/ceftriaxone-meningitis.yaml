drug: ceftriaxone
drug_name: Ceftriaxone
indication: Bacterial meningitis
indication_detail: Suspected or proven bacterial meningitis
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 12 hours
rate: over 30 minutes
max: 4 g per day (label)
cautions:
  - "Empiric therapy is vancomycin plus ceftriaxone, plus ampicillin if over 50 years or immunocompromised (Listeria)."
  - "Dexamethasone 0.15 mg/kg every 6 hours for 2–4 days, started before or with the first antibiotic dose."
  - Does not cover Listeria, Enterococcus or MRSA.
notes: "Meningitis uses the highest daily dose. The label's maximum is 4 g a day."
sources: [idsa-meningitis-2004, label-ceftriaxone-2026]
verification:
