drug: phenobarbital
drug_name: Phenobarbital
indication: Alcohol withdrawal in the ICU, symptom-triggered (off-label, unapproved product)
population: Adults in the ICU
route: IV
amount: 130
unit: mg
frequency: "every 30 minutes as needed to a RASS of 0 to −1"
give_when: ICU patient with withdrawal not controlled by benzodiazepines, or with a contraindication to benzodiazepines
cautions:
  - "Continuous monitoring of respiration and sedation. Airway equipment at the bedside."
  - "Label: inject IV slowly, no faster than 60 mg per minute. Peak effect can take 15 minutes or more."
notes: "ASAM Appendix V sample regimen for ICU monotherapy. As an adjunct after a maximum diazepam dose, ASAM lists escalating doses of 60, 120 then 240 mg IV every 30 minutes to a RASS of 0 to −2. In hospitalized adults, observational data suggest outcomes close to diazepam (Bradley 2026). In the ICU, evidence is very low certainty (Rizwan 2026)."
sources: [asam-alcohol-withdrawal-2020, bradley-phenobarbital-2026, rizwan-phenobarbital-2026, label-phenobarbital-inj-2025]
verification:
