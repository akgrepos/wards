drug: calcium-gluconate
drug_name: Calcium gluconate 10%
indication: Hyperkalemia with ECG changes (membrane stabilization)
population: Adults
route: IV
amount: 30
unit: mL
rate: over 10 minutes
give_when: ECG changes
repeat: If ECG changes persist or recur
onset: 1–3 minutes
lasts: 30–60 minutes
alternative:
  dose: calcium-chloride-hyperkalemia
  when: Cardiac arrest or peri-arrest
notes: "30 mL of 10% calcium gluconate gives about the same calcium (6.8 mmol) as 10 mL of 10% calcium chloride. Calcium does not lower potassium. UK guideline rate: faster than the US label (up to 200 mg/min)."
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020]
verification:
  source: ukka-hyperkalaemia-2026
  read: not-verified
  date: 2026-10-23
