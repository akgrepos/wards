drug: nitroglycerin
drug_name: Nitroglycerin infusion
indication: Persistent ischemia, hypertension or pulmonary edema (ACS or acute heart failure)
population: Adults
route: IV
amount: "5"
unit: mcg/min
rate: "start 5 mcg/min. Increase by 5 mcg/min every 3–5 minutes, then by 10–20 mcg/min if no response at 20 mcg/min"
max: "200 mcg/min (heart failure guideline, no maximum in the label)"
cautions:
  - "Reduce or stop for SBP <90 mm Hg or symptomatic hypotension."
  - "Use non-PVC tubing and an infusion pump. Tolerance develops after 24–48 hours."
notes: "ACS guideline start: 10 mcg/min. Label start 5 mcg/min with non-PVC tubing."
sources: [label-ntg-premix-2016, esc-hf-2021, acc-aha-acs-2025]
verification:
  source: label-ntg-premix-2016
  read: not-verified
  date: 2026-10-23
