drug: dabigatran
drug_name: Dabigatran
brand: Pradaxa
indication: Acute DVT or PE treatment
indication_detail: Acute DVT or PE treatment, after 5–10 days of parenteral anticoagulation.
population: Adults
route: PO
amount: "150"
unit: mg
frequency: twice daily
adjustments:
  - when: CrCl ≤30 mL/min or dialysis
    change: No dosing recommendation. Avoid
  - when: CrCl <50 mL/min with a P-gp inhibitor (dronedarone, ketoconazole)
    change: Avoid
cautions:
  - "Needs 5–10 days of parenteral anticoagulation first."
sources: [label-pradaxa-2025, ash-vte-treatment-2020]
verification:
  source: label-pradaxa-2025
  read: not-verified
