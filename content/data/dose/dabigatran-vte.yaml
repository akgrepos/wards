drug_name: Dabigatran
brand: Pradaxa
indication: Acute DVT or PE treatment, after 5–10 days of parenteral anticoagulation
population: Adults
route: PO
amount: "150"
unit: mg
frequency: twice daily
boxed_warning: "Premature discontinuation raises the risk of thrombotic events; spinal or epidural hematoma with neuraxial anesthesia or spinal puncture."
adjustments:
  - when: CrCl ≤30 mL/min or dialysis
    change: No dosing recommendation; avoid
  - when: CrCl <50 mL/min with a P-gp inhibitor (dronedarone, ketoconazole)
    change: Avoid
cautions:
  - "Needs 5–10 days of parenteral anticoagulation first."
  - "Swallow capsules whole; opening them increases absorption."
  - "Avoid P-gp inducers such as rifampin."
sources: [label-pradaxa-2025, ash-vte-treatment-2020]
