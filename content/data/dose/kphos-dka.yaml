drug: potassium-phosphates
drug_name: Potassium phosphate
indication: DKA or HHS with severe hypophosphatemia and muscle weakness or respiratory or cardiac compromise
population: Adults
route: IV
amount: 20–30
unit: mmol
rate: "added to the IV fluids (peripheral: no faster than 6.8 mmol per hour)"
give_when: "Not routine: only with weakness, respiratory or cardiac compromise and a very low phosphate"
notes: "Phosphate falls with insulin. Routine replacement does not improve outcomes."
