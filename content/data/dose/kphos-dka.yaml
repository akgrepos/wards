drug: potassium-phosphates
drug_name: Potassium phosphate
indication: DKA or HHS with severe hypophosphatemia
indication_detail: DKA or HHS with severe hypophosphatemia and muscle weakness or respiratory or cardiac compromise.
population: Adults
route: IV
amount: 20–30
unit: mmol
rate: "added to the IV fluids (peripheral: no faster than 6.8 mmol per hour)"
give_when: "Not routine: only with weakness, respiratory or cardiac compromise and a very low phosphate"
cautions:
  - "The potassium in the product counts toward the potassium dose: use only when K⁺ is below 4 mEq/L, and reduce the potassium in the fluids to match."
  - "Label contraindications: hyperkalemia and severe kidney impairment (eGFR <30 mL/min)."
notes: "Phosphate falls with insulin. Routine replacement does not improve outcomes."
sources: [ada-hyperglycemic-crises-2024, label-kphos-injection-2026]
verification:
