drug_name: Cephalexin
indication: Complicated UTI, oral, susceptible isolate
population: Adults
route: PO
amount: 500–1,000
unit: mg
frequency: every 6 hours
adjustments:
  - when: CrCl <60 mL/min
    change: "Reduce per the label (CrCl 30–59: no more than 1 g per day)"
notes: Lower doses had more treatment failure; the top of the range reaches the label maximum of 4 g per day.
sources:
  - idsa-cuti-ivpo-2025
  - label-cephalexin-2026
