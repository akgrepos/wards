drug: calcium-chloride
drug_name: Calcium chloride 10%
indication: Hyperkalemia with ECG changes
indication_detail: Hyperkalemia with ECG changes in cardiac arrest or peri-arrest.
population: Adults
route: IV
amount: 10
unit: mL
rate: over 5 minutes
give_when: ECG changes in cardiac arrest or peri-arrest
alternative:
  dose: calcium-gluconate-hyperkalemia
  when: All other patients
notes: "Preferred calcium salt in resuscitation (cardiac arrest or peri-arrest). About three times the calcium of the same volume of calcium gluconate. UK guideline rate: faster than the US label (up to 1 mL/min). Large vein or central line preferred (tissue necrosis if extravasated)."
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020]
verification:
  source: ukka-hyperkalaemia-2026
  read: not-verified
  date: 2026-10-23
