drug_name: Calcium chloride 10%
indication: Hyperkalemia with ECG changes in cardiac arrest or peri-arrest
population: Adults
route: IV
amount: 10
unit: mL
rate: over 5 minutes
give_when: ECG changes in cardiac arrest or peri-arrest
alternative:
  dose: calcium-gluconate-hyperkalemia
  when: All other patients
notes: "Preferred calcium salt in resuscitation (cardiac arrest or peri-arrest). About three times the calcium of the same volume of calcium gluconate."
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020]
verification:
