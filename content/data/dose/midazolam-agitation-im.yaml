drug: midazolam
drug_name: Midazolam
brand: Midazolam injection
indication: Severe agitation needing rapid sedation in a monitored setting (off-label)
population: Adults without respiratory compromise
route: IM
amount: 5
unit: mg
frequency: once. Reassess before any repeat dose
give_when: Severe agitation or danger where fast onset is needed, with continuous oxygen saturation monitoring and airway support at the bedside
repeat: "Studied as a single dose. Repeat only after reassessment, with airway support at the bedside"
max: "No guideline maximum for agitation"
cautions:
  - "Continuous pulse oximetry and a clinician who can manage the airway. Avoid on a general ward without that."
  - "Older adults: ACEP made no recommendation above 65. The label reduces IM doses at 60 or older (as little as 1 mg)."
  - "ACEP's ED combination with an atypical antipsychotic assumes ED monitoring. The olanzapine label does not recommend IM olanzapine with a parenteral benzodiazepine."
notes: "Dose as studied in the ED trials in the ACEP policy (5 mg IM). ACEP prefers droperidol or an atypical antipsychotic plus midazolam, and an antipsychotic over midazolam alone. The label covers preoperative sedation (about 5 mg IM in adults under 60), not agitation."
sources: [label-midazolam-inj-2026, acep-severe-agitation-2023, aaep-beta-psychopharm-2012]
