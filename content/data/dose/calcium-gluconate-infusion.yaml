drug_name: Calcium gluconate
indication: Hypocalcemia persisting or recurring after IV boluses
population: Adults
route: IV
amount: "5.4–21.5"
unit: mg/kg/h
rate: "continuous infusion, adjusted to serum calcium"
give_when: "Hypocalcemia persists or recurs after boluses"
boxed_warning: None
adjustments:
  - when: "Renal impairment"
    change: "Start at the lowest dose"
cautions:
  - "Serum calcium every 1–4 hours during the infusion."
  - "Calcium phosphate can precipitate in tissues when phosphate is high."
notes: "About 0.5–2 mg/kg per hour of elemental calcium. One preparation: 100 mL of 10% calcium gluconate in 1 L of D5W or saline, started at 50 mL per hour. Aim for low-normal calcium. Start oral calcium alongside."
sources: [label-calcium-gluconate-2026, endotext-hypocalcemia-2016, cooper-hypocalcaemia-2008]
verification:
  source: label-calcium-gluconate-2026
  read: not-verified
  date: 2026-10-23
