drug: meropenem
drug_name: Meropenem
indication: Healthcare-associated meningitis, or meningitis with a resistant gram-negative organism
population: Adults
route: IV
amount: "2"
unit: g
frequency: every 8 hours
rate: over 30 minutes
adjustments:
  - when: CrCl 26–50 mL/min
    change: Give the dose every 12 hours
  - when: CrCl 10–25 mL/min
    change: Give half the dose every 12 hours
  - when: CrCl <10 mL/min
    change: Give half the dose every 24 hours
notes: "IDSA 2004 lists 6 g a day in divided doses every 8 hours. The label's adult dosing is for other infections and its meningitis dose is for children."
sources: [idsa-meningitis-2004, idsa-ventriculitis-2017, label-meropenem-2024]
verification:
  source: idsa-meningitis-2004
  read: not-verified
  date: 2026-10-23
