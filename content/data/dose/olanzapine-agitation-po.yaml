drug: olanzapine
drug_name: Olanzapine
brand: Zyprexa, Zyprexa Zydis
indication: Mild to moderate agitation in a patient who accepts oral medication (off-label except agitation in schizophrenia or bipolar I mania, which is IM)
population: Adults
route: oral or orally disintegrating tablet
amount: 5–10
unit: mg
frequency: once. Reassess before any repeat dose
give_when: Agitation from psychosis or delirium, or undifferentiated agitation, when the patient will take a tablet
repeat: "May repeat after 2 hours if needed (consensus table)"
max: "20 mg a day by mouth (label and consensus table)"
cautions:
  - "Sedation and orthostatic hypotension add up with a benzodiazepine. Reassess before adding one."
  - "Anticholinergic effects: avoid or use less in delirium and older adults when possible."
  - "Older or debilitated adults: start at a lower dose."
notes: "Doses from the AAEP psychopharmacology consensus. The label covers the IM route for agitation."
sources: [label-zyprexa-2026, aaep-beta-psychopharm-2012, acep-severe-agitation-2023]
verification:
  source: aaep-beta-psychopharm-2012
  read: full-text
  date: 2026-10-23
