name: Healthcare-associated or neurosurgical meningitis
indication: Meningitis or ventriculitis after neurosurgery, a shunt or an external drain
setting: "Remove or replace infected hardware where possible; cultures from the cerebrospinal fluid"
options:
  - label: Vancomycin plus an antipseudomonal β-lactam
    doses: [vancomycin-meningitis, [cefepime-nosocomial, meropenem-meningitis]]
duration: "10–14 days for most gram-positive and gram-negative organisms (some use 21 days for gram-negative bacilli), counted from the last positive culture"
notes:
  - "Serious β-lactam allergy: aztreonam or ciprofloxacin for gram-negative coverage, with infectious diseases."
sources: [idsa-ventriculitis-2017, idsa-meningitis-2004]
