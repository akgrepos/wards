name: Higher risk or healthcare-associated
indication: Complicated intra-abdominal infection
setting: "Severe illness, postoperative or healthcare-associated infection, recent antibiotics, or resistant colonization"
options:
  - label: Antipseudomonal β-lactam
    doses: [[piperacillin-tazobactam-nosocomial, meropenem-nosocomial]]
  - label: Cefepime plus metronidazole
    doses: [cefepime-nosocomial, metronidazole-iv]
  - label: Add MRSA coverage
    when: "Known MRSA colonization, or treatment failure after substantial antibiotic exposure. Not routine"
    doses: [vancomycin-iv]
  - label: Add an echinocandin
    when: "Candida grown from abdominal or blood cultures, or significant risk (recent abdominal surgery, anastomotic leak, necrotizing pancreatitis)"
    doses: [micafungin-candidemia]
duration: "4 days after adequate source control. Up to 8 days in the critically ill"
notes:
  - "Use meropenem when ESBL risk is high. Avoid piperacillin-tazobactam and cefepime for known ESBL infection."
  - "Enterococcal coverage in higher-risk disease: piperacillin-tazobactam already covers E. faecalis. Otherwise ampicillin or vancomycin. Known VRE colonization or liver transplant: linezolid or daptomycin, with infectious diseases."
  - "Obtain intra-abdominal cultures at source control and narrow to the results."
sources: [idsa-sis-iai-2010, sis-iai-2024, idsa-candida-2016, idsa-amr-2026]
