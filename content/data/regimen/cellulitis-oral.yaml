name: Mild, oral
indication: Nonpurulent cellulitis or erysipelas
setting: "No systemic signs. Active against streptococci"
options:
  - doses: [[cephalexin-ssti, penicillin-vk-ssti, dicloxacillin-ssti, clindamycin-po-ssti]]
duration: "5 days. Extend if not improved"
notes:
