name: Pseudomonas risk
indication: Community-acquired pneumonia
setting: "An antipseudomonal β-lactam in place of the standard β-lactam, with a macrolide or respiratory fluoroquinolone"
options:
  - doses: [[piperacillin-tazobactam-cap, cefepime-cap, meropenem-1g], [azithromycin-iv-cap, levofloxacin-750, moxifloxacin-cap]]
duration: "7 days if Pseudomonas is suspected or proven. Narrow when cultures are negative"
notes:
  - "Other guideline options: ceftazidime, imipenem, or aztreonam (for severe β-lactam allergy, with MSSA-active cover such as a fluoroquinolone)."
  - "These options do not reliably cover ESBL-producing organisms. Consider those only on patient or local data."
sources: [idsa-ats-cap-2019]
