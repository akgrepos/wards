# Acute pericarditis: PR depression and concave ST elevation in V5 with the reverse in aVR, drawn (no open dataset has a labeled recording; DECISIONS 2026-10-17 "Images").
# Each wave is a smooth bump [height mV, center s from the R wave, width s]; measurements are read from the shape against the TP baseline (J point = R wave + 35 ms) (mm = 0.1 mV).
kind: ecg-drawing
title: Acute pericarditis
alt: "Two drawn beats. Lead V5: the PR segment dips 1.3 mm below the baseline, then the J point is elevated 2.2 mm and the ST segment curves concave upward into an upright T wave. Lead aVR: the mirror image, PR elevation and ST depression."
caption: "V5: PR depression and concave ST elevation. aVR (and V1): the reverse, PR elevation and ST depression."
illustrates: "Diffuse concave ST elevation with PR depression, without reciprocal ST depression."
sources: [acc-pericarditis-ccg-2025, esc-myopericarditis-2025]
panels:
  - title: Pericarditis (V5)
    cue: PR depression, ST elevation
    seconds: 1.1
    beats: [0.45]
    waves: [[0.12, -0.16, 0.028], [-0.13, -0.085, 0.03], [1.0, 0, 0.011], [0.18, 0.035, 0.035], [0.32, 0.21, 0.085]]
    marks:
      - { kind: baseline, from: 0.1, to: 0.95, mv: 0 }
      - { kind: band, from: 0.33, to: 0.41, low: -0.15, high: 0 }
      - { kind: band, from: 0.485, to: 0.66, low: 0, high: 0.33 }
      - { kind: text, at: 0.38, mv: -0.13, label: "PR −1.3 mm", place: below, align: end }
      - { kind: text, at: 0.6, mv: 0.34, label: "J +2.2 mm", place: above, align: start }
  - title: Pericarditis (aVR)
    cue: PR elevation, ST depression
    seconds: 1.1
    beats: [0.45]
    waves: [[-0.12, -0.16, 0.028], [0.13, -0.085, 0.03], [-1.0, 0, 0.011], [-0.18, 0.035, 0.035], [-0.32, 0.21, 0.085]]
    marks:
      - { kind: baseline, from: 0.1, to: 0.95, mv: 0 }
