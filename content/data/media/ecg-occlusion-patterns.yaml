# ECG patterns that can signal acute coronary occlusion without classic ST elevation, drawn (no open dataset has labeled recordings of these; DECISIONS 2026-10-17 "Images").
# Drawn on the same exact scale as recordings: each wave is a smooth bump [height mV, center s from the R wave, width s].
# Measurements on the drawings (mm = 0.1 mV) are read from these shapes at the J point (R wave + 60 ms) or at the wave peak, against the PR baseline.
kind: ecg-drawing
title: Occlusion patterns without ST elevation
alt: "Four drawn precordial beats: hyperacute T wave taller than the R wave; de Winter pattern with 3 mm upsloping ST depression and a tall T wave; Wellens pattern with a 6.5 mm inverted T wave; posterior pattern with 2.3 mm ST depression and a tall R wave."
caption: "Drawn patterns: hyperacute T wave → de Winter → Wellens (pain-free) → posterior (V1–V3 ST depression, tall R)."
illustrates: "Hyperacute T waves, de Winter pattern, Wellens pattern and posterior MI (V1–V3 ST depression with tall R waves)."
sources: [kontos-chest-pain-ecdp-2022, dewinter-2008, dezwaan-wellens-1982, wagner-ecg-ischemia-2009]
panels:
  - title: Hyperacute T wave
    cue: Broad, tall T; T taller than R
    seconds: 1.1
    beats: [0.45]
    waves: [[0.12, -0.17, 0.03], [0.45, 0, 0.011], [-1.0, 0.032, 0.014], [0.25, 0.12, 0.06], [1.3, 0.24, 0.055]]
    marks:
      - { kind: band, from: 0.59, to: 0.82, low: 0, high: 1.4 }
      - { kind: height, at: 0.69, from_mv: 0, to_mv: 1.33, label: "T 13 mm" }
      - { kind: text, at: 0.45, mv: 0.45, label: "R 4 mm", place: above, align: end }
  - title: de Winter pattern
    cue: Upsloping ST depression, tall T
    seconds: 1.1
    beats: [0.45]
    waves: [[0.12, -0.17, 0.03], [1.2, 0, 0.011], [-0.3, 0.028, 0.014], [-0.3, 0.075, 0.04], [1.15, 0.24, 0.05]]
    marks:
      - { kind: baseline, from: 0.28, to: 0.88, mv: 0 }
      - { kind: band, from: 0.5, to: 0.55, low: -0.35, high: 0 }
      - { kind: text, at: 0.64, mv: -0.2, label: "J −3 mm", place: below, align: start }
      - { kind: band, from: 0.58, to: 0.82, low: 0, high: 1.2 }
  - title: Wellens pattern (type B)
    cue: Deep symmetric T inversion
    seconds: 1.1
    beats: [0.45]
    waves: [[0.12, -0.17, 0.03], [1.0, 0, 0.011], [-0.25, 0.03, 0.012], [-0.65, 0.25, 0.05]]
    marks:
      - { kind: baseline, from: 0.28, to: 0.88, mv: 0 }
      - { kind: band, from: 0.58, to: 0.82, low: -0.7, high: 0 }
      - { kind: text, at: 0.66, mv: 0.25, label: "T −6.5 mm", place: above, align: start }
  - title: Posterior pattern (V2)
    cue: ST depression, tall R
    seconds: 1.1
    beats: [0.45]
    waves: [[0.12, -0.17, 0.03], [1.1, 0, 0.011], [-0.2, 0.028, 0.013], [-0.25, 0.10, 0.05], [0.6, 0.28, 0.05]]
    marks:
      - { kind: baseline, from: 0.28, to: 0.88, mv: 0 }
      - { kind: text, at: 0.68, mv: -0.2, label: "ST −2.3 mm", place: below, align: start }
      - { kind: band, from: 0.53, to: 0.6, low: -0.3, high: 0 }
