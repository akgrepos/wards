name: Sodium correction for hyperglycemia
short: "corrected sodium"
url: https://www.mdcalc.com/calc/50/sodium-correction-hyperglycemia
match: ["corrected sodium"]
sources: [katz-sodium-1973, hillier-glucose-sodium-1999, ada-hyperglycemic-crises-2009, ada-hyperglycemic-crises-2024]
calculator:
  kind: formula
  heading: Sodium corrected for hyperglycemia
  expression: "Na⁺ + 1.6 × (glucose − 100) ÷ 100"
  inputs:
    - { id: na, label: "Measured sodium", unit: "mEq/L", min: 90, max: 200 }
    - { id: glucose, label: "Glucose", unit: "mg/dL", min: 10, max: 2000 }
  results:
    - { fn: corrected-sodium, label: "Corrected sodium", unit: "mEq/L", decimals: 1, needs: [na, glucose] }
  reference: "Adds 1.6 mEq/L for each 100 mg/dL of glucose above 100. No correction at or below 100 mg/dL."
  notes:
    - "An estimate. Other studies give a larger factor at very high glucose."
verification:
  source: katz-sodium-1973
  read: not-verified
  date: 2026-10-23
