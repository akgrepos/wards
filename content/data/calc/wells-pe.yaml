name: "Wells' criteria for pulmonary embolism"
short: "Wells score for PE"
url: https://www.mdcalc.com/calc/115/wells-criteria-pulmonary-embolism
match: ["Wells score for PE"]
sources: [wells-pe-2001, ash-vte-diagnosis-2018, aha-acc-pe-2026]
calculator:
  kind: checklist
  heading: Wells score for PE
  with: wells-dvt
  items:
    - { label: "Clinical signs of DVT (leg swelling, pain on palpation of deep veins)", points: 3 }
    - { label: "PE is the most likely diagnosis, or equally likely", points: 3 }
    - { label: "Heart rate >100 bpm", points: 1.5 }
    - { label: "Immobilization ≥3 days, or surgery in the previous 4 weeks", points: 1.5 }
    - { label: "Previous DVT or PE", points: 1.5 }
    - { label: "Hemoptysis", points: 1 }
    - { label: "Malignancy (on treatment, treated in the last 6 months, or palliative)", points: 1 }
  bandSets:
    - title: "Three levels"
      bands:
        - { from: 0, to: 1.5, range: "<2", label: "Low", risk: "PE prevalence 1.3%" }
        - { from: 2, to: 6, range: "2–6", label: "Moderate", risk: "PE prevalence 16.2%" }
        - { from: 6.5, range: ">6", label: "High", risk: "PE prevalence 37.5%", high: true }
    - title: "Two levels"
      bands:
        - { from: 0, to: 4, range: "≤4", label: "PE unlikely", risk: "PE prevalence 7.8%", action: "D-dimer; a negative result excludes PE." }
        - { from: 4.5, range: ">4", label: "PE likely", action: "Imaging (CT pulmonary angiography)." }
  notes:
    - "Prevalences are from the 2001 emergency department cohort. Hospitalized patients: the score performs poorly."
verification:
  source: wells-pe-2001
  read: not-verified
  date: 2026-10-23
