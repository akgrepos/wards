name: Confusion Assessment Method (CAM)
title: "Confusion Assessment Method (CAM), 1990"
short: CAM
logic: "Delirium needs features 1 and 2, plus 3 or 4:"
items:
  - "1. Acute onset and fluctuating course: a change from baseline that comes and goes during the day"
  - "2. Inattention: difficulty focusing, for example losing the thread of a conversation"
  - "3. Disorganized thinking: rambling or irrelevant talk, unclear or illogical flow of ideas"
  - "4. Altered level of consciousness: anything other than alert (vigilant, lethargic, stuporous, comatose)"
notes:
  - "Inattention is tested at the bedside, for example by reciting the months backward. The CAM is scored by a trained rater after a brief cognitive test."
  - "In ventilated patients use the {{calc:cam-icu}} (which adds a {{calc:rass}} step) rather than the CAM."
sources: [inouye-cam-1990, ely-camicu-2001]
