name: Confusion Assessment Method (CAM)
title: "Confusion Assessment Method (CAM)"
short: CAM
logic: "Delirium needs features 1 and 2, plus 3 or 4:"
items:
  - "**Acute onset and fluctuating course:** a change from baseline that comes and goes during the day"
  - "**Inattention:** difficulty focusing, for example losing the thread of a conversation"
  - "**Disorganized thinking:** rambling or irrelevant talk, unclear or illogical flow of ideas"
  - "**Altered level of consciousness:** anything other than alert (vigilant, lethargic, stuporous, comatose)"
notes:
  - "Inattention is tested at the bedside, for example by reciting the months backward."
  - "In ventilated patients use the {{calc:cam-icu}} (which adds a {{calc:rass}} step) rather than the Confusion Assessment Method."
sources: [inouye-cam-1990, ely-camicu-2001]
