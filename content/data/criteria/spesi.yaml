name: Simplified PE Severity Index (sPESI)
title: "Simplified PE Severity Index (sPESI), 2026"
short: sPESI
logic: "1 point each:"
items:
  - "Age >80 years"
  - "Cancer"
  - "Chronic cardiopulmonary disease"
  - "Heart rate ≥110 bpm"
  - "Systolic blood pressure <100 mm Hg"
  - "Arterial oxygen saturation <90%"
notes:
  - "0 points: low risk of 30-day mortality (category B); ≥1: elevated (category C). {{calc:pesi}} ≤85 points and {{calc:hestia}} 0 are equivalent low-risk scores."
sources: [aha-acc-pe-2026]
