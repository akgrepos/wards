name: Clinical stability in community-acquired pneumonia
short: clinical stability
logic: "All of:"
items:
  - "Temperature ≤37.8 °C (100 °F)"
  - "Heart rate ≤100 beats/min"
  - "Respiratory rate ≤24 breaths/min"
  - "Systolic BP ≥90 mm Hg"
  - "SpO₂ ≥90% or PaO₂ ≥60 mm Hg on room air"
  - "Able to eat"
  - "Normal mental status"
notes:
  - "The 2019 and 2025 guidelines tie antibiotic duration to these vital signs, eating and mentation; antibiotics continue until stability and the minimum course."
sources: [idsa-ats-cap-2007, idsa-ats-cap-2019, ats-cap-2025]
