name: Global definition of ARDS (2024)
title: "Global definition of ARDS, 2024"
short: global ARDS definition
logic: "All of:"
items:
  - "Onset or worsening within 1 week of a known risk factor (e.g. pneumonia, sepsis, aspiration, trauma, pancreatitis) or new respiratory symptoms"
  - "Bilateral opacities on chest radiograph or CT, or bilateral B-lines and/or consolidation on lung ultrasound, not fully explained by effusions, atelectasis or nodules"
  - "Not primarily from cardiogenic pulmonary edema or fluid overload (hydrostatic edema may coexist)"
  - "Hypoxemia: not intubated, PaO₂/FiO₂ ≤300 or SpO₂/FiO₂ ≤315 (if SpO₂ ≤97%) on high-flow oxygen ≥30 L/min or NIV/CPAP with end-expiratory pressure ≥5 cm H₂O. Intubated, by severity below"
columns: [Severity, Intubated patients]
rows:
  - ["Mild", "PaO₂/FiO₂ >200 and ≤300, or SpO₂/FiO₂ >235 and ≤315 (if SpO₂ ≤97%)"]
  - ["Moderate", "PaO₂/FiO₂ >100 and ≤200, or SpO₂/FiO₂ >148 and ≤235 (if SpO₂ ≤97%)"]
  - ["Severe", "PaO₂/FiO₂ ≤100, or SpO₂/FiO₂ ≤148 (if SpO₂ ≤97%)"]
notes:
  - "Intubated patients need PEEP ≥5 cm H₂O. Where blood gases, PEEP or imaging are limited, a resource-limited variant uses SpO₂/FiO₂ and ultrasound without a PEEP requirement."
sources: [ards-global-definition-2024]
