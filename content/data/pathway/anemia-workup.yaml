# A focused pathway: the workup of anemia in the hospitalized adult as a decision tree that supplements the card.
# Rule out bleeding, hemolysis and microangiopathy first, then split by MCV and reticulocytes.
# Format: docs/CONTENT-FORMAT.md, "Pathways".
title: Workup
card: heme-anemia
summary: Rule out bleeding and hemolysis, then MCV and reticulocytes
columns: 18
start: start
sources: [who-anemia-2024, isth-ttp-dx-2020, ash-iron-deficiency-dx-2026, aga-ida-2020, isth-ttp-2020, isth-ttp-2025, bendapudi-plasmic-2017, bsh-b12-folate-2014]
nodes:
  start:
    kind: start
    at: [6, 0]
    span: 6
    title: Anemia on CBC
    text:
      - Compare with prior counts. Read the smear.
      - "Draw reticulocytes, iron studies, B12, folate, LDH and haptoglobin before any transfusion."
    next: flags
  flags:
    kind: question
    at: [6, 1]
    span: 6
    title: Active bleeding, instability, or hemolysis flags?
    text: "Hemoglobin lags acute loss. Flags: melena, shock, thrombocytopenia with schistocytes, raised LDH or bilirubin."
    answers:
      - { label: "Yes", at: [1, 2], span: 3, to: urgent }
      - { label: "No", at: [10, 2], span: 4, to: mcv }
  urgent:
    kind: urgent
    at: [0, 3]
    span: 5
    title: Treat the cause now
    text:
      - "Bleeding: resuscitate; transfuse on clinical grounds."
      - "Schistocytes with low platelets: treat as TTP; draw ADAMTS13, then start plasma exchange and steroids without waiting for the result."
    links: ["card:gi-upper-gi-bleeding"]
    next: urgent-end
  urgent-end:
    kind: result
    at: [0, 4]
    span: 5
    title: Hematology the same hour for TTP
    text: "{{calc:plasmic|PLASMIC}} 6–7 predicts severe ADAMTS13 deficiency. Same day for other hemolysis (DAT, LDH, haptoglobin, smear)."
  mcv:
    kind: question
    at: [10, 3]
    span: 6
    title: MCV?
    answers:
      - { label: Microcytic, detail: Below 80 fL, at: [6, 4], span: 4, to: micro }
      - { label: Normocytic, detail: 80–100 fL, at: [10, 4], span: 4, to: normo }
      - { label: Macrocytic, detail: Above 100 fL, at: [14, 4], span: 4, to: macro }
  micro:
    kind: question
    at: [4, 5]
    span: 5
    title: "Iron deficient?"
    text: "Ferritin at {{threshold:ferritin-iron-deficiency}}. With inflammation: ferritin below 100 ng/mL or transferrin saturation below 20% (either)."
    answers:
      - { label: "Yes", at: [2, 6], span: 3, to: iron }
      - { label: "No", at: [6, 6], span: 3, to: thal }
  iron:
    kind: result
    at: [2, 7]
    span: 3
    title: Iron deficiency
    text: "Find the source (bidirectional endoscopy, celiac testing). Replace iron: oral first, IV if it fails."
  thal:
    kind: result
    at: [6, 7]
    span: 3
    title: Not iron deficiency
    text: "Thalassemia trait ({{calc:mentzer|Mentzer index}}), anemia of inflammation or sideroblastic anemia; hemoglobin electrophoresis."
  normo:
    kind: question
    at: [9, 5]
    span: 5
    title: Reticulocyte production index 2 or higher?
    text: "Corrected for hematocrit and early release ({{calc:rpi|reticulocyte production index}})."
    answers:
      - { label: "High", at: [9, 6], span: 3, to: hemolysis }
      - { label: "Low", at: [12, 6], span: 3, to: hypo }
  hemolysis:
    kind: result
    at: [9, 7]
    span: 3
    title: Hemolysis or blood loss
    text: "LDH, haptoglobin, bilirubin, DAT, smear. Look for bleeding. Hematology if hemolysis."
  hypo:
    kind: result
    at: [12, 7]
    span: 3
    title: Underproduction
    text: "Iron studies, creatinine, TSH, B12. Anemia of inflammation or CKD; hematology if other cell lines are low."
  macro:
    kind: result
    at: [14, 5]
    span: 4
    title: Macrocytic
    text: "B12 (methylmalonic acid if 200–300 pg/mL), folate, TSH, liver tests, alcohol and drugs. Hematology if still unexplained or other cell lines are low."
