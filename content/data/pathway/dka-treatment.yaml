# A focused pathway (owner, 2026-10-21): the treatment of DKA and HHS as a levelled flowchart that supplements the
# card. Fluids, then potassium, then insulin by type of crisis, dextrose, bicarbonate, monitoring and resolution. Text
# and doses come from the card's own lines and dose items. Format: docs/CONTENT-FORMAT.md, "Pathways".
title: Treatment
card: endo-dka
summary: Fluids, potassium, insulin, dextrose, resolve
columns: 12
start: confirm
sources: [ada-hyperglycemic-crises-2024, ada-soc-hospital-2026, jbds-hhs-2022, label-kcl-injection-2026]
nodes:
  confirm:
    kind: start
    at: [4, 0]
    span: 4
    title: Confirm DKA or HHS
    text:
      - Glucose, β-hydroxybutyrate, venous pH, BMP with anion gap, calculated osmolality.
      - Look for the precipitant; stop SGLT2 inhibitors.
    links: [criteria:dka-hhs]
    next: fluids
  fluids:
    kind: do
    at: [4, 1]
    span: 4
    title: IV fluids
    text:
      - "{{dose:crystalloid-dka}}"
      - Smaller boluses with heart failure, dialysis or older age.
    next: potassium
  potassium:
    kind: question
    at: [4, 2]
    span: 4
    title: K⁺?
    text: Once urine output is established.
    answers:
      - { label: "<3.5 mEq/L", at: [0, 3], span: 4, to: k-low }
      - { label: "3.5–5.0 mEq/L", at: [4, 3], span: 4, to: k-mid }
      - { label: ">5.0 mEq/L", at: [8, 3], span: 4, to: k-high }
  k-low:
    kind: urgent
    at: [0, 4]
    span: 4
    title: Replace K⁺; hold insulin
    text:
      - "{{dose:kcl-dka-low}}"
      - Start insulin once K⁺ is >3.5 mEq/L.
    next: crisis
  k-mid:
    kind: do
    at: [4, 4]
    span: 4
    title: Potassium in the fluids
    text:
      - "{{dose:kcl-dka-maintenance}}"
      - Target K⁺ 4–5 mEq/L.
    next: crisis
  k-high:
    kind: do
    at: [8, 4]
    span: 4
    title: No potassium yet
    text: Start insulin; recheck K⁺ every 2 hours and add potassium once it falls to 5.0 mEq/L or below.
    next: crisis
  crisis:
    kind: question
    at: [4, 5]
    span: 4
    title: Which crisis?
    links: [criteria:dka-severity]
    answers:
      - { label: Moderate or severe DKA, detail: Or mixed DKA/HHS, at: [0, 6], span: 4, to: iv-dka }
      - { label: Mild DKA, detail: Alert and uncomplicated, at: [4, 6], span: 4, to: sc-dka }
      - { label: HHS, detail: No significant ketoacidosis, at: [8, 6], span: 4, to: iv-hhs }
  iv-dka:
    kind: do
    at: [0, 7]
    span: 4
    title: IV insulin infusion
    text:
      - "{{dose:insulin-regular-dka}}"
      - Bolus only if starting the infusion will be delayed.
    next: dextrose
  sc-dka:
    kind: do
    at: [4, 7]
    span: 4
    title: SC rapid-acting insulin
    text:
      - "{{dose:insulin-rapid-sc-dka}}"
      - Not for severe or complicated DKA or HHS.
    next: dextrose
  iv-hhs:
    kind: do
    at: [8, 7]
    span: 4
    title: Lower-rate IV insulin
    text:
      - "{{dose:insulin-regular-hhs}}"
      - Correct slowly; Na⁺ fall no more than 10 mEq/L in 24 hours.
    next: dextrose
  dextrose:
    kind: do
    at: [4, 8]
    span: 4
    title: Add dextrose as glucose falls
    text:
      - "DKA or HHS: at glucose <250 mg/dL; euglycemic DKA: from the start."
      - "{{dose:dextrose-dka}}"
      - "DKA: lower insulin to half its starting rate; HHS: keep its rate. Never stop insulin for falling glucose. Targets: DKA 150–200 mg/dL, HHS 200–250 mg/dL."
    next: ph
  ph:
    kind: question
    at: [4, 9]
    span: 4
    title: pH <7.0?
    answers:
      - { label: "No", at: [2, 10], span: 4, to: monitor }
      - { label: "Yes", at: [6, 10], span: 4, to: bicarbonate }
  bicarbonate:
    kind: do
    at: [6, 11]
    span: 4
    title: Sodium bicarbonate
    text:
      - "{{dose:sodium-bicarbonate-dka}}"
      - Add potassium.
    next: monitor
  monitor:
    kind: do
    at: [4, 12]
    span: 4
    title: Monitor
    text: "Glucose every 1–2 hours; K⁺ 2 hours after starting insulin, then every 4 hours; electrolytes, β-hydroxybutyrate and venous pH every 2–4 hours; osmolality in HHS."
    links: [section:endo-dka/monitor]
    next: resolved
  resolved:
    kind: question
    at: [4, 13]
    span: 4
    title: Resolved?
    text: "DKA: β-hydroxybutyrate <0.6 mmol/L and pH ≥7.3 or HCO₃⁻ ≥18 mEq/L. HHS: osmolality <300 mOsm/kg, glucose <250 mg/dL, urine output >0.5 mL/kg/h, cognition improved."
    answers:
      - { label: Not yet, at: [2, 14], span: 4, to: continue }
      - { label: "Yes", at: [6, 14], span: 4, to: transition }
  continue:
    kind: result
    at: [2, 15]
    span: 4
    title: Continue fluids, insulin and dextrose
    text: Keep monitoring; recheck for an untreated precipitant if progress stalls.
  transition:
    kind: result
    at: [6, 15]
    span: 4
    title: Transition to SC insulin
    text:
      - "Basal insulin at least 1–2 hours before stopping the infusion (ADA 2026: 2–4 hours); switch once able to eat."
      - "{{dose:insulin-transition-dka}}"
    links: ["section:endo-dka/treatment#resolution-and-transition-to-sc-insulin"]
