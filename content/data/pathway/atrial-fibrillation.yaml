# A whole-card map of the Atrial Fibrillation card (owner's choice, 2026-10-20). Boxes give a short decision or
# instruction from the card and link to its sections, the Rapids Do Now steps and the dose sheets; no dose is copied.
title: Atrial Fibrillation
card: cardio-atrial-fibrillation
columns: 4
start: start
sources: [acc-aha-af-2023, esc-af-2024, aha-acls-2025]
nodes:
  start:
    kind: start
    at: [2, 0]
    title: AF on ECG
    text: Irregularly irregular R-R intervals without distinct P waves.
    links: [section:cardio-atrial-fibrillation/diagnosis]
    next: stable
  stable:
    kind: question
    at: [2, 1]
    stage: Stabilize
    title: Unstable from AF?
    text: Hypotension, ongoing ischemia, pulmonary edema or shock attributable to the rate.
    links: [section:cardio-atrial-fibrillation/severity]
    answers:
      - { label: "Yes", at: [1, 2], to: cardiovert }
      - { label: "No", at: [2, 2], to: preexcitation }
  cardiovert:
    kind: urgent
    at: [1, 3]
    title: Synchronized cardioversion
    text: Start anticoagulation without delaying it.
    links: [emergency:cardio-atrial-fibrillation, "section:cardio-atrial-fibrillation/treatment#unstable-synchronized-cardioversion"]
    next: precipitant
    rejoin: true
  preexcitation:
    kind: question
    at: [2, 3]
    title: Pre-excitation?
    text: Very fast and irregular with varying wide QRS complexes, or a delta wave.
    links: [section:cardio-atrial-fibrillation/diagnosis]
    answers:
      - { label: "Yes", at: [3, 4], to: wpw }
      - { label: "No", at: [2, 4], to: ef }
  wpw:
    kind: urgent
    at: [3, 5]
    title: No AV nodal blockers
    text: Cardioversion if unstable; IV procainamide or ibutilide if stable. Urgent cardiology.
    links: [emergency:cardio-atrial-fibrillation, section:cardio-atrial-fibrillation/escalation]
    next: precipitant
    rejoin: true
  ef:
    kind: question
    at: [2, 5]
    stage: Rate control
    title: LVEF and blood pressure?
    links: ["section:cardio-atrial-fibrillation/treatment#rate-control"]
    answers:
      - { label: "LVEF >40%, not decompensated", at: [1, 6], to: bbccb }
      - { label: "LVEF ≤40%, decompensated, or borderline blood pressure", at: [2, 6], to: amio }
  bbccb:
    kind: do
    at: [1, 7]
    title: IV β-blocker or diltiazem
    links: [dose:metoprolol-iv-af, dose:diltiazem-iv-af, dose:diltiazem-infusion-af]
    next: precipitant
  amio:
    kind: do
    at: [2, 7]
    title: IV amiodarone or digoxin
    text: No nondihydropyridine calcium channel blockers in decompensated HFrEF.
    links: [dose:amiodarone-iv-af, dose:digoxin-iv-af]
    next: precipitant
  precipitant:
    kind: do
    at: [2, 8]
    title: Treat the precipitant
    text: Sepsis, hypovolemia, hypoxemia, PE, thyrotoxicosis, alcohol, ischemia; check K⁺ and Mg²⁺.
    links: [section:cardio-atrial-fibrillation/causes]
    next: oral
  oral:
    kind: do
    at: [2, 9]
    title: Oral rate control
    text: Resting HR {{threshold:af-rate-lenient}}.
    links: ["section:cardio-atrial-fibrillation/treatment#rate-control", dose:metoprolol-tartrate-po-af]
    next: stroke
  stroke:
    kind: question
    at: [2, 10]
    stage: Anticoagulation
    title: Stroke risk?
    links: [criteria:cha2ds2-vasc, "section:cardio-atrial-fibrillation/treatment#anticoagulation-for-stroke-prevention"]
    answers:
      - { label: "Mechanical valve or moderate–severe mitral stenosis", at: [0, 11], to: warfarin }
      - { label: "High", detail: "{{threshold:af-anticoag-recommended}}", at: [1, 11], to: doac }
      - { label: "Score 1 in men, 2 in women", at: [2, 11], to: reasonable }
      - { label: "Score 0 in men, 1 in women", at: [3, 11], to: none }
  warfarin:
    kind: do
    at: [0, 12]
    title: Warfarin
    text: INR 2.0–3.0; DOACs are not used.
    links: [section:cardio-atrial-fibrillation/more#special-populations]
    next: cv
  doac:
    kind: do
    at: [1, 12]
    title: Anticoagulate, DOAC preferred
    links: [dose:apixaban-af, dose:rivaroxaban-af, dose:dabigatran-af, dose:edoxaban-af]
    next: cv
  reasonable:
    kind: do
    at: [2, 12]
    title: Anticoagulation reasonable
    text: DOAC preferred.
    links: ["section:cardio-atrial-fibrillation/treatment#anticoagulation-for-stroke-prevention"]
    next: cv
  none:
    kind: note
    at: [3, 12]
    title: No anticoagulation for stroke prevention
    text: Except around cardioversion, or with hypertrophic cardiomyopathy or amyloidosis.
    links: ["section:cardio-atrial-fibrillation/treatment#anticoagulation-for-stroke-prevention"]
    next: cv
  cv:
    kind: question
    at: [2, 13]
    stage: Rhythm
    title: Elective cardioversion planned?
    links: ["section:cardio-atrial-fibrillation/treatment#cardioversion-and-anticoagulation"]
    answers:
      - { label: "AF ≥48 h or unknown duration", at: [1, 14], to: cv48 }
      - { label: "AF <48 h", at: [2, 14], to: cvshort }
      - { label: "No", at: [3, 14], to: rhythm, rejoin: true }
  cv48:
    kind: do
    at: [1, 15]
    title: 3 weeks of anticoagulation or TEE first
    text: Then anticoagulate at least 4 weeks after.
    links: ["section:cardio-atrial-fibrillation/treatment#cardioversion-and-anticoagulation"]
    next: rhythm
  cvshort:
    kind: do
    at: [2, 15]
    title: Anticoagulate as soon as possible
    text: If high stroke risk; at least 4 weeks after cardioversion. Wait-and-see is an option.
    links: ["section:cardio-atrial-fibrillation/treatment#cardioversion-and-anticoagulation", section:cardio-atrial-fibrillation/more#guidelines-differ]
    next: rhythm
  rhythm:
    kind: do
    at: [2, 16]
    title: Consider rhythm control
    text: Symptoms despite rate control, HFrEF, AF diagnosed within 1 year, younger age.
    links: ["section:cardio-atrial-fibrillation/treatment#rhythm-control", section:cardio-atrial-fibrillation/escalation]
    next: done
  done:
    kind: result
    at: [2, 17]
    title: Long-term plan
    links: [section:cardio-atrial-fibrillation/more#after-acute, section:cardio-atrial-fibrillation/monitor]
