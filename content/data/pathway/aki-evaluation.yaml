# A whole-card map (owner, 2026-10-19): another way to look at the Acute Kidney Injury card. Boxes hold a short
# decision or instruction taken from the card and link to the card's own sections, criteria and doses, so nothing
# is copied. Only questions branch. Layout: "at: [column, row]" on a grid; rows are as tall as their tallest box.
title: AKI Evaluation
card: renal-aki
columns: 6
start: start
sources: [kdigo-aki-2012, nice-aki-2024, aasld-ascites-hrs-2021, aha-cardiorenal-2019, smart-2018, perazella-urine-microscopy-2008, moore-aki-core-2018, muriithi-urine-eos-2013, podoll-renal-us-2013]
nodes:
  start:
    kind: start
    at: [2, 0]
    title: Rising SCr or low urine output
    next: confirm
  confirm:
    kind: question
    at: [2, 1]
    stage: Confirm
    title: Meets KDIGO criteria for AKI?
    text: Compare with prior SCr values; evaluate for unrecognized CKD before labeling a rise as acute.
    links: [criteria:kdigo-aki, section:renal-aki/definition]
    answers:
      - { label: "Yes", at: [2, 2], to: first }
      - { label: "No", at: [3, 2], to: not-aki }
  not-aki:
    kind: result
    at: [3, 3]
    title: Not AKI by KDIGO criteria
    text: SCr lags behind kidney injury; an early normal SCr does not exclude AKI. Repeat SCr and follow urine output.
    links: [section:renal-aki/definition]
  first:
    kind: do
    at: [2, 3]
    title: Stage it; start the common orders
    text: Stop nephrotoxins, strict intake and output, daily weights, renal dosing, bladder scan. First-line tests, including urine dipstick in all.
    links: [criteria:kdigo-aki, "section:renal-aki/treatment#common-initial-orders", "section:renal-aki/diagnosis#first-line"]
    next: refractory
  refractory:
    kind: question
    at: [2, 4]
    stage: Stabilize
    title: Urgent RRT indication?
    text: "Complication refractory to medical therapy: hyperkalemia, metabolic acidosis, fluid overload or pulmonary edema, uremic complications. Dialyzable poisoning (e.g. lithium, toxic alcohols, salicylates)."
    links: [section:renal-aki/first-steps, card:renal-hyperkalemia]
    answers:
      - { label: "Yes", at: [1, 5], to: rrt }
      - { label: "No", at: [2, 5], to: obstruction }
  rrt:
    kind: urgent
    at: [0, 6]
    title: Urgent RRT evaluation
    text: Discuss potential indications with nephrology or critical care immediately.
    links: ["section:renal-aki/treatment#rrt", section:renal-aki/escalation]
    next: obstruction
    rejoin: true
  hk-card:
    kind: link
    at: [0, 7]
    to: card:renal-hyperkalemia
    text: Its pathway and treatment
    from: rrt
  hk-rapids:
    kind: link
    at: [0, 8]
    to: emergency:renal-hyperkalemia
    text: Calcium, shift, remove K⁺
    from: hk-card
  obstruction:
    kind: question
    at: [2, 6]
    stage: Postrenal
    title: Urinary tract obstruction?
    text: "Anuria: exclude a blocked catheter. Bladder scan; renal ultrasound within 24 h if no clear cause or risk of obstruction, within 6 h if pyonephrosis suspected."
    links: [section:renal-aki/first-steps, "section:renal-aki/diagnosis#first-line"]
    answers:
      - { label: "No obstruction", at: [2, 7], to: perfusion }
      - { label: "Hydronephrosis", at: [3, 7], to: relieve }
  relieve:
    kind: do
    at: [4, 8]
    title: Relieve the obstruction
    text: "Upper tract obstruction: urology; immediately for pyonephrosis, solitary kidney, bilateral obstruction or complications; nephrostomy or stent within 12 h."
    links: [section:renal-aki/escalation]
    next: relieved
  relieved:
    kind: question
    at: [4, 9]
    title: Relieved, and AKI resolving?
    answers:
      - { label: "No: other causes too", at: [4, 10], to: perfusion, rejoin: true }
      - { label: "Yes", at: [5, 10], to: postrenal }
  postrenal:
    kind: result
    at: [5, 11]
    title: Postrenal AKI
    text: Monitor SCr and urine output.
    links: ["section:renal-aki/treatment#all-stages"]
  perfusion:
    kind: question
    at: [2, 10]
    stage: Prerenal
    title: Volume status and hemodynamics?
    links: ["section:renal-aki/presentation#focused-examination"]
    answers:
      - { label: "Hypovolemia or vasomotor shock", at: [0, 11], to: volume }
      - { label: "Hemorrhage", at: [1, 11], to: hemorrhage }
      - { label: "Euvolemic, normotensive", at: [2, 11], to: sediment }
      - { label: "Congestion or low output", at: [3, 11], to: cardiorenal }
      - { label: "Cirrhosis with ascites", at: [4, 11], to: cirrhosis }
  volume:
    kind: do
    at: [0, 12]
    title: Restore volume and perfusion
    text: Isotonic crystalloid; balanced crystalloid in the critically ill (0.9% saline in traumatic brain injury); vasopressors with fluids in vasomotor shock.
    links: [section:renal-aki/first-steps, "section:renal-aki/treatment#all-stages"]
    next: response
  hemorrhage:
    kind: do
    at: [1, 12]
    title: Hemorrhagic shock
    text: Blood products and hemorrhage control; crystalloid-first guidance does not apply.
    links: [section:renal-aki/first-steps]
    next: response
  cardiorenal:
    kind: do
    at: [3, 12]
    title: Cardiorenal
    text: Loop diuretics for congestion; a modest SCr rise during effective decongestion is not by itself harmful.
    links: ["section:renal-aki/treatment#specific-situations"]
    next: response
  cirrhosis:
    kind: do
    at: [4, 12]
    title: Cirrhosis with ascites
    text: Stop diuretics and nephrotoxins; give albumin.
    links: [dose:albumin-aki-cirrhosis, "section:renal-aki/treatment#specific-situations"]
    next: cirrhosis-response
  response:
    kind: question
    at: [1, 13]
    title: SCr and urine output improve?
    text: "Response to treatment is itself diagnostic. Cardiorenal: a modest SCr rise during effective decongestion is not by itself harmful."
    answers:
      - { label: "Yes", at: [0, 14], to: prerenal }
      - { label: "No", at: [1, 14], to: sediment, rejoin: true }
  prerenal:
    kind: result
    at: [0, 15]
    title: Prerenal AKI
    text: Keep treating the cause; monitor SCr and urine output.
    links: [section:renal-aki/pearls]
  cirrhosis-response:
    kind: question
    at: [4, 13]
    title: Improves after 2 days?
    answers:
      - { label: "No", at: [4, 14], to: hrs }
      - { label: "Yes", at: [5, 14], to: cirrhosis-ok }
  hrs:
    kind: result
    at: [4, 15]
    title: Possible HRS-AKI
    text: "If no shock, no recent nephrotoxins and no structural injury: vasoconstrictor plus albumin. Otherwise, urinalysis with sediment microscopy."
    links: ["section:renal-aki/treatment#specific-situations", "section:renal-aki/diagnosis#first-line"]
  cirrhosis-ok:
    kind: result
    at: [5, 15]
    title: Responds to treatment
    text: Continue treatment; monitor SCr and urine output.
    links: ["section:renal-aki/treatment#specific-situations"]
  sediment:
    kind: question
    at: [2, 16]
    stage: Intrinsic
    title: Urinalysis with sediment microscopy
    links: ["section:renal-aki/diagnosis#first-line", "section:renal-aki/diagnosis#urinary-indices-oliguric-aki"]
    answers:
      - { label: "Granular casts or tubular epithelial cells", at: [0, 17], to: atn }
      - { label: "Hematuria with proteinuria, no UTI or catheter trauma", at: [1, 17], to: gn }
      - { label: "Suspected AIN (mostly drug-induced)", at: [2, 17], to: ain }
      - { label: "Heme-positive dipstick without RBCs", at: [3, 17], to: pigment }
      - { label: "None of these", at: [4, 17], to: bland }
  atn:
    kind: result
    at: [0, 18]
    title: Acute tubular injury (ATN) likely
    text: Ischemic (hypoperfusion, sepsis) or toxic (aminoglycosides, amphotericin B, contrast).
    links: [section:renal-aki/causes, "section:renal-aki/treatment#all-stages"]
  gn:
    kind: result
    at: [1, 18]
    title: Possible acute nephritis (GN, vasculitis)
    text: Serologies; biopsy if needed for diagnosis. Nephrology within 24 h.
    links: ["section:renal-aki/diagnosis#second-line-by-scenario", section:renal-aki/escalation]
  ain:
    kind: result
    at: [2, 18]
    title: Possible AIN
    text: Stop nephrotoxins where possible. Urine eosinophils do not distinguish AIN; definitive diagnosis is by kidney biopsy. Nephrology within 24 h.
    links: ["section:renal-aki/diagnosis#second-line-by-scenario", section:renal-aki/escalation]
  pigment:
    kind: result
    at: [3, 18]
    title: Rhabdomyolysis or hemolysis
    text: "Rhabdomyolysis: CK. Hemolysis: hemoglobin, platelets, LDH, haptoglobin, bilirubin, smear."
    links: ["section:renal-aki/diagnosis#second-line-by-scenario"]
  bland:
    kind: result
    at: [4, 18]
    title: Second-line tests by scenario
    text: Tumor lysis, myeloma, hemolysis or TMA, abdominal compartment syndrome. Nephrology within 24 h if no clear cause.
    links: ["section:renal-aki/diagnosis#second-line-by-scenario", section:renal-aki/escalation]
# Links that apply to every route, shown in a row at the foot of the map.
footer: ["section:renal-aki/treatment#stage-2-and-above", section:renal-aki/escalation, "section:renal-aki/more#after-acute"]
