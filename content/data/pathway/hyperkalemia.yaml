# A whole-card map (owner, 2026-10-19): another way to look at the Hyperkalemia card. Boxes hold a short decision or
# instruction taken from the card and link to the card's sections, the Rapids Do Now steps and the dose sheets, so
# no dose is copied. Only questions branch. Layout: "at: [column, row]" on a grid.
title: Hyperkalemia
card: renal-hyperkalemia
columns: 5
start: start
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020, aha-special-circumstances-2025, emcreg-hyperkalemia-2025]
nodes:
  start:
    kind: start
    at: [2, 0]
    title: Raised K⁺
    text: Commonly K⁺ ≥5.5 mEq/L; cutoffs vary by laboratory and by serum vs plasma.
    next: confirm
  confirm:
    kind: question
    at: [2, 1]
    stage: Confirm
    title: True hyperkalemia?
    text: "Result discordant with the clinical picture: consider pseudohyperkalemia."
    links: [section:renal-hyperkalemia/diagnosis]
    answers:
      - { label: "Confirmed or likely", at: [2, 2], to: ecg }
      - { label: "Possibly spurious", at: [3, 2], to: repeat }
  repeat:
    kind: do
    at: [3, 3]
    title: Repeat the measurement
    text: "Large vein, gentle traction, prompt analysis. Emergency: blood gas K⁺ while awaiting the laboratory value. Do not delay the ECG."
    links: [section:renal-hyperkalemia/diagnosis]
    next: ecg
    rejoin: true
  pseudo:
    kind: link
    at: [4, 3]
    to: section:renal-hyperkalemia/causes
    text: "Repeat normal: pseudohyperkalemia (hemolysis, prolonged tourniquet or fist clenching, clotted sample, marked leukocytosis or thrombocytosis, delayed or cold storage)"
    from: repeat
  ecg:
    kind: do
    at: [2, 4]
    title: STAT 12-lead ECG
    text: "At {{threshold:k-ecg-monitoring}}. A normal ECG does not exclude life-threatening hyperkalemia. No ECG or monitor yet available: calcium at {{threshold:k-calcium-without-ecg}} (KDIGO)."
    links: [section:renal-hyperkalemia/diagnosis]
    next: ecg-changes
  ecg-changes:
    kind: question
    at: [2, 5]
    stage: Stabilize
    title: ECG changes of hyperkalemia?
    text: "Peaked T waves, P-wave flattening, PR prolongation, QRS widening, sine wave. High risk: QRS prolongation, symptomatic bradycardia, junctional rhythm."
    links: [section:renal-hyperkalemia/presentation]
    answers:
      - { label: "Yes", at: [1, 6], to: calcium }
      - { label: "No", at: [2, 6], to: no-calcium }
  calcium:
    kind: urgent
    at: [1, 7]
    title: Stabilize the myocardium
    text: IV calcium (calcium chloride preferred in cardiac arrest or peri-arrest); repeat if ECG changes persist or recur. Does not lower K⁺.
    links: [emergency:renal-hyperkalemia, dose:calcium-gluconate-hyperkalemia, "section:renal-hyperkalemia/treatment#cardiac-membrane-stabilization"]
    next: severity
  arrest:
    kind: link
    at: [0, 8]
    to: "section:renal-hyperkalemia/treatment#hyperkalemic-cardiac-arrest"
    text: If cardiac arrest
    from: calcium
  no-calcium:
    kind: note
    at: [2, 7]
    title: Normal ECG
    text: IV calcium not recommended.
    links: ["section:renal-hyperkalemia/treatment#cardiac-membrane-stabilization"]
    next: severity
  severity:
    kind: question
    at: [2, 9]
    stage: Shift
    title: Severity?
    links: [section:renal-hyperkalemia/severity]
    answers:
      - { label: "Severe", detail: "{{threshold:k-severe}}", at: [1, 10], to: severe }
      - { label: "Moderate", detail: "{{threshold:k-moderate}}", at: [2, 10], to: moderate }
      - { label: "Mild", detail: "{{threshold:k-mild}}", at: [3, 10], to: cause, rejoin: true }
  severe:
    kind: urgent
    at: [1, 11]
    title: Shift, add albuterol, remove K⁺
    text: "Check glucose first. Insulin with dextrose, nebulized albuterol, sodium zirconium cyclosilicate (US labels: binders are not emergency treatment). Urgent renal or critical care opinion."
    links: [emergency:renal-hyperkalemia, "section:renal-hyperkalemia/treatment#intracellular-shift", "section:renal-hyperkalemia/treatment#elimination", section:renal-hyperkalemia/escalation]
    next: kidney
  moderate:
    kind: do
    at: [2, 11]
    title: Shift; consider removal
    text: Insulin with dextrose suggested; consider sodium zirconium cyclosilicate.
    links: ["section:renal-hyperkalemia/treatment#intracellular-shift", "section:renal-hyperkalemia/treatment#elimination"]
    next: kidney
  kidney:
    kind: question
    at: [2, 12]
    stage: Eliminate
    title: Kidney function and dialysis?
    links: ["section:renal-hyperkalemia/treatment#elimination"]
    answers:
      - { label: "On maintenance dialysis, severe hyperkalemia", at: [0, 13], to: dialysis }
      - { label: "Maintenance dialysis (not severe), oliguric AKI or refractory", at: [1, 13], to: nephrology }
      - { label: "Non-oliguric, especially with volume overload", at: [2, 13], to: furosemide }
      - { label: "None of these", at: [3, 13], to: monitor }
  dialysis:
    kind: urgent
    at: [0, 14]
    title: Urgent dialysis
    links: [section:renal-hyperkalemia/escalation]
    next: monitor
  nephrology:
    kind: do
    at: [1, 14]
    title: Nephrology to consider dialysis
    links: ["section:renal-hyperkalemia/treatment#elimination", card:renal-aki]
    next: monitor
  furosemide:
    kind: do
    at: [2, 14]
    title: Add IV furosemide
    text: Nephrology if AKI.
    links: [dose:furosemide-hyperkalemia, section:renal-hyperkalemia/escalation]
    next: monitor
  monitor:
    kind: do
    at: [2, 15]
    stage: Monitor
    title: Monitor
    text: K⁺ at least at 1, 2, 4, 6 and 24 h after treating moderate or severe hyperkalemia; rebound at 2–3 h if K⁺ has not been eliminated. Glucose for 6 h after insulin.
    links: [section:renal-hyperkalemia/monitor, emergency:renal-hyperkalemia]
    next: cause
  cause:
    kind: do
    at: [2, 16]
    title: Find and treat the cause
    text: Medication review, renal function, hemolysis screen, cause of AKI if present.
    links: [section:renal-hyperkalemia/causes, section:renal-hyperkalemia/diagnosis, card:renal-aki]
    next: done
  done:
    kind: result
    at: [2, 17]
    title: Acute episode treated
    links: ["section:renal-hyperkalemia/more#after-acute", section:renal-hyperkalemia/escalation]
