title: Acute hyperkalemia management
stages: [Confirm, Stabilize, Shift, Eliminate, Monitor]
start: confirm
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020]
steps:
  confirm:
    kind: question
    stage: Confirm
    title: True hyperkalemia?
    detail: Consider pseudohyperkalemia if the result is discordant with the clinical picture.
    answers:
      - { label: Confirmed or likely, detail: "Concordant with the clinical picture, or confirmed on repeat or blood gas sample", to: ecg }
      - { label: Possibly spurious, detail: "Hemolysis, delayed sample, tourniquet or fist clenching, marked leukocytosis or thrombocytosis", to: spurious }
  ecg:
    kind: question
    stage: Stabilize
    title: ECG changes of hyperkalemia?
    detail: "STAT 12-lead ECG at {{threshold:k-ecg-monitoring}}. A normal ECG does not exclude life-threatening hyperkalemia."
    answers:
      - { label: "Yes", detail: "Peaked T waves, P-wave flattening, PR prolongation, QRS widening, sine wave, bradycardia", to: calcium }
      - { label: "No", detail: No ECG changes, to: severity }
  calcium:
    kind: caution
    stage: Stabilize
    title: Cardiac membrane stabilization
    detail: "{{dose:calcium-gluconate-hyperkalemia}}. Cardiac arrest or peri-arrest: {{dose:calcium-chloride-hyperkalemia}}. Repeat if ECG changes persist or recur. Does not lower K⁺."
    next: severity
  severity:
    kind: question
    stage: Shift
    title: Severity?
    answers:
      - { label: Severe, detail: "{{threshold:k-severe}}", to: shift }
      - { label: Moderate, detail: "{{threshold:k-moderate}}", to: shift-moderate }
      - { label: Mild, detail: "{{threshold:k-mild}}", to: mild }
  shift:
    kind: action
    stage: Shift
    title: Intracellular shift
    detail: "{{dose:insulin-regular-hyperkalemia}} with {{dose:dextrose-50-hyperkalemia}}, plus {{dose:albuterol-neb-hyperkalemia}}. Pre-treatment glucose {{threshold:glucose-hypoglycemia-risk}}: follow with {{dose:dextrose-10-infusion-hyperkalemia}}."
    next: remove
  shift-moderate:
    kind: action
    stage: Shift
    title: Consider intracellular shift
    detail: "Insulin-dextrose suggested; albuterol may be added. Doses as for severe: {{dose:insulin-regular-hyperkalemia}} with {{dose:dextrose-50-hyperkalemia}}."
    next: remove-moderate
  remove:
    kind: action
    stage: Eliminate
    title: K⁺ elimination
    detail: "{{dose:szc-hyperkalemia-initial}}. Non-oliguric with volume overload: add {{dose:furosemide-hyperkalemia}}. Maintenance dialysis: urgent dialysis. Oliguric AKI or refractory: nephrology to consider dialysis."
    next: monitor
  remove-moderate:
    kind: action
    stage: Eliminate
    title: Consider K⁺ elimination
    detail: "Consider {{dose:szc-hyperkalemia-initial}}. Non-oliguric with volume overload: consider {{dose:furosemide-hyperkalemia}}."
    next: monitor
  monitor:
    kind: result
    stage: Monitor
    title: Monitoring and etiology
    list:
      - "Continuous cardiac monitoring: {{threshold:k-severe}}, ECG changes, or {{threshold:k-moderate}} if unwell"
      - "K⁺ at least at 1, 2, 4, 6 and 24 h; rebound at 2–3 h"
      - "Glucose at 0, 30, 60, 90, 120, 180, 240, 300 and 360 min after insulin"
      - "Stop or reduce K⁺-raising drugs; treat the cause"
  mild:
    kind: result
    stage: Monitor
    title: Mild hyperkalemia
    list:
      - "Identify and treat the cause, including K⁺-raising drugs"
      - "Repeat K⁺"
  spurious:
    kind: result
    stage: Confirm
    title: Repeat measurement
    list:
      - "Repeat from a large vein, gentle traction, prompt analysis"
      - "Blood gas K⁺ for a rapid result"
