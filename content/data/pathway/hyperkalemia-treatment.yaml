# A focused pathway (owner, 2026-10-20; decision-tree layout 2026-10-21): the treatment of hyperkalemia as a decision
# tree that supplements the card. Each question's answers sit side by side in the row below it, each leading to its
# own box or the next question. Text and doses come from the
# card's own lines and dose items (a line that is only {{dose:…}} shows the card's dose row). Grid: "at: [column,
# row]" and "span" (columns wide). Format: docs/CONTENT-FORMAT.md, "Pathways".
title: Treatment
card: renal-hyperkalemia
summary: Stabilize, shift, remove, monitor
columns: 12
start: ecg-first
sources: [ukka-hyperkalaemia-2026, kdigo-acute-hyperkalemia-2020, emcreg-hyperkalemia-2025, label-lokelma-2024, label-veltassa-2025]
nodes:
  ecg-first:
    kind: start
    at: [4, 0]
    span: 4
    title: STAT 12-lead ECG
    text: "At {{threshold:k-ecg-monitoring}}."
    next: ecg
  ecg:
    kind: question
    at: [4, 1]
    span: 4
    title: ECG changes of hyperkalemia?
    text: "Peaked T waves, P-wave flattening, PR prolongation, QRS widening, sine wave. A normal ECG does not exclude life-threatening hyperkalemia."
    answers:
      - { label: Normal ECG, detail: IV calcium not recommended, at: [0, 2], span: 4, to: severity }
      - { label: "Yes", at: [4, 2], span: 4, to: calcium }
      - { label: No ECG or monitor yet, detail: "KDIGO: calcium at {{threshold:k-calcium-without-ecg}}", at: [8, 2], span: 4, to: calcium }
  calcium:
    kind: urgent
    at: [5, 3]
    span: 6
    title: IV calcium
    text:
      - "{{dose:calcium-gluconate-hyperkalemia}}"
      - "Cardiac arrest or peri-arrest: calcium chloride preferred."
      - "{{dose:calcium-chloride-hyperkalemia}}"
      - Repeat if ECG changes persist or recur. Does not lower K⁺.
      - Continuous cardiac monitoring.
    links: ["section:renal-hyperkalemia/treatment#hyperkalemic-cardiac-arrest"]
    next: severity
  severity:
    kind: question
    at: [4, 4]
    span: 4
    title: Severity?
    answers:
      - { label: Mild, detail: "{{threshold:k-mild}}", at: [0, 5], span: 4, to: kidney }
      - { label: Moderate, detail: "{{threshold:k-moderate}}", at: [4, 5], span: 4, to: moderate }
      - { label: Severe, detail: "{{threshold:k-severe}}", at: [8, 5], span: 4, to: severe }
  moderate:
    kind: do
    at: [4, 6]
    span: 4
    title: Shift K⁺; consider removal
    text:
      - Continuous cardiac monitoring if unwell or K⁺ rising rapidly.
      - "Insulin with dextrose suggested. Pre-treatment glucose {{threshold:glucose-hypoglycemia-risk}}: follow with a dextrose 10% infusion; glucose {{threshold:glucose-skip-dextrose}}: insulin may be given without dextrose."
      - "{{dose:insulin-regular-hyperkalemia}}"
      - "{{dose:dextrose-50-hyperkalemia}}"
      - "{{dose:dextrose-10-infusion-hyperkalemia}}"
      - "Consider sodium zirconium cyclosilicate. US labels: K⁺ binders are not emergency treatment for life-threatening hyperkalemia (delayed onset)."
      - "{{dose:szc-hyperkalemia-initial}}"
    next: kidney
  severe:
    kind: urgent
    at: [8, 6]
    span: 4
    title: Shift K⁺, add albuterol, remove K⁺
    text:
      - Continuous cardiac monitoring; monitored bed.
      - "Insulin with dextrose recommended. Pre-treatment glucose {{threshold:glucose-hypoglycemia-risk}}: follow with a dextrose 10% infusion; glucose {{threshold:glucose-skip-dextrose}}: insulin may be given without dextrose."
      - "{{dose:insulin-regular-hyperkalemia}}"
      - "{{dose:dextrose-50-hyperkalemia}}"
      - "{{dose:dextrose-10-infusion-hyperkalemia}}"
      - "Add nebulized albuterol."
      - "Never albuterol alone."
      - "Not recommended during cardiac arrest."
      - "{{dose:albuterol-neb-hyperkalemia}}"
      - "Sodium zirconium cyclosilicate (UK guideline recommends). US labels: K⁺ binders are not emergency treatment for life-threatening hyperkalemia (delayed onset)."
      - "{{dose:szc-hyperkalemia-initial}}"
      - Urgent renal or critical care opinion, guided by the clinical picture.
    next: kidney
  kidney:
    kind: question
    at: [4, 7]
    span: 4
    title: Kidney function and dialysis?
    answers:
      - { label: On maintenance dialysis, at: [0, 8], span: 3, to: dialysis }
      - { label: Oliguric AKI, at: [3, 8], span: 3, to: nephrology }
      - { label: Non-oliguric, detail: Especially with volume overload, at: [6, 8], span: 3, to: furosemide }
      - { label: None of these, at: [9, 8], span: 3, to: monitor }
  dialysis:
    kind: urgent
    at: [0, 9]
    span: 3
    title: Dialysis patient
    text:
      - "Severe hyperkalemia: urgent dialysis."
      - "Otherwise: nephrology."
    next: monitor
  nephrology:
    kind: do
    at: [3, 9]
    span: 3
    title: Nephrology to consider dialysis
    next: monitor
  furosemide:
    kind: do
    at: [6, 9]
    span: 3
    title: IV furosemide
    text:
      - "{{dose:furosemide-hyperkalemia}}"
      - "Hyperkalemia with AKI: nephrology."
    next: monitor
  monitor:
    kind: do
    at: [4, 10]
    span: 4
    title: Recheck K⁺ and glucose
    text: "K⁺ at least at 1, 2, 4, 6 and 24 h after treating moderate or severe hyperkalemia; rebound at 2–3 h if K⁺ has not been eliminated. Glucose for 6 h after insulin. Refractory hyperkalemia: nephrology to consider dialysis."
    links: [section:renal-hyperkalemia/monitor]
    next: cause
  cause:
    kind: result
    at: [4, 11]
    span: 4
    title: Find and treat the cause
    text: Medication review, renal function, hemolysis screen, cause of AKI if present.
    links: [section:renal-hyperkalemia/causes]
