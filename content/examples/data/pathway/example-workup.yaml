# Example whole-card map (format: docs/CONTENT-FORMAT.md, "Pathways"). Boxes sit on a grid ("at: [column, row]");
# only questions branch; links open the card's own content instead of copying it.
title: Example workup
card: example-condition
columns: 3
start: start
sources: [example-guideline-a]
nodes:
  start: { kind: start, at: [1, 0], title: Finding on a test, next: confirmed }
  confirmed:
    kind: question
    at: [1, 1]
    title: Is the finding confirmed?
    links: [section:example-condition/diagnosis]
    answers:
      - { label: Confirmed, detail: Repeat sample agrees, at: [1, 2], to: value }
      - { label: Likely spurious, at: [2, 2], to: repeat }
  repeat: { kind: result, at: [2, 3], title: Repeat the sample, links: ["section:example-condition/diagnosis#placeholder-first-step"] }
  value:
    kind: question
    at: [1, 3]
    title: Measured value
    answers:
      - { label: Severe, detail: "Above {{threshold:example-cutoff}}", at: [0, 4], to: treat }
      - { label: Mild, at: [1, 4], to: cause }
  treat: { kind: urgent, at: [0, 5], title: Treat first, links: [dose:example-drug-standard, section:example-condition/treatment], next: cause }
  cause: { kind: result, at: [1, 6], title: Find the cause, links: [section:example-condition/more] }
