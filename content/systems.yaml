- { id: crit, title: "Critical Care", subsections: ["Shock and Sepsis"] }
- { id: gi, title: "Gastroenterology", subsections: ["Gastrointestinal Bleeding"] }
- { id: liver, title: "Hepatology" }
- { id: renal, title: "Nephrology and Urology", subsections: ["Electrolyte Disorders"] }
- { id: id, title: "Infectious Disease", subsections: ["Respiratory Infections", "Skin and Soft Tissue Infections", "Urinary Tract Infections"] }
- { id: heme, title: "Hematology" }
- { id: onc, title: "Oncology" }
- { id: endo, title: "Endocrinology", subsections: ["Diabetes and Glucose"] }
- { id: rheum, title: "Rheumatology" }
- { id: neuro, title: "Neurology", subsections: ["Altered Mental Status"] }
- { id: psych, title: "Psychiatry" }
