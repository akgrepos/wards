# The 16 systems, in display order. Card files name their system by id.
# "subsections" is the allowed list of a system's condition-card subsections (a card's `subsection` must be one of them);
# to use a new name, add it here first (docs/CONTENT-FORMAT.md).
- { id: cardio, title: "Cardiology", subsections: ["Arrhythmias", "Heart Failure and Cardiomyopathy", "Ischemic Heart Disease"] }
