name: Checks

# Runs on every pull request. main only accepts changes that pass, so publishing doesn't re-run these.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # only to put the tier label on the PR

# A newer push to the same PR cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit authors are anonymous
        # Only GitHub no-reply addresses are allowed. Prints commit IDs, never names, because logs are public.
        run: |
          bad=$(git log --format='%h %ae %ce' ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print $1; break } }')
          if [ -n "$bad" ]; then echo "These commits have a non-anonymous author or committer:"; echo "$bad"; exit 1; fi
      - name: Only card and docs files changed? (then the screenshot-free look check is skipped; every other check still runs)
        id: scope
        run: |
          other=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -v -E '^(content|docs)/' || true)
          if [ -z "$other" ]; then echo "content_only=true" >> "$GITHUB_OUTPUT"; else echo "content_only=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Design system styles are up to date
        run: npm run tokens && git diff --exit-code src/design/tokens.css
      - name: Content rules (sources, inserts, sections, units, no typed doses)
        run: npm run content:check
      - name: No private details in repo files (emails, home paths, outside source names)
        run: npm run privacy:check
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Every built file works offline
        run: npm run check:offline
      - name: Cards whose content changed (job summary)
        run: node scripts/content/compose-diff.mjs origin/${{ github.event.pull_request.base.ref }}
      - name: Release tier (label and reasons; fails if a clinical change has no matching Checked stamp)
        run: npm run pr:tier -- --base origin/${{ github.event.pull_request.base.ref }} --label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Browser cache (WebKit for the look check)
        if: steps.scope.outputs.content_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright WebKit (for the look check)
        if: steps.scope.outputs.content_only != 'true'
        run: npx playwright install --with-deps webkit
      - name: Look check (links, tap targets, design-token colors and fonts, no leftovers; no pictures)
        if: steps.scope.outputs.content_only != 'true'
        run: npm run look -- --no-build --no-sheet
